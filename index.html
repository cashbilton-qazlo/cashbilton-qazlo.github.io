                                    <h6 className="font-bold text-stone-800 text-xs mb-2">Throat Area (A_t)</h6>
                                    <p className="text-xs text-stone-600 mb-2 flex-grow">Determined by choking conditions (Mach 1) for the requested mass flow and chamber pressure.</p>
                                    <div className="bg-stone-50 p-2 rounded border border-stone-100 font-mono text-[11px] text-center overflow-x-auto whitespace-nowrap">
                                        A_t = (ṁ / P_c) * √(R·T_c / γ) * ((γ+1)/2)^((γ+1)/(2(γ-1)))
                                    </div>
                                </div>

                                <div className="bg-white p-4 rounded-xl border border-stone-200 shadow-sm flex flex-col">
                                    <h6 className="font-bold text-stone-800 text-xs mb-2">Expansion Ratio (ε)</h6>
                                    <p className="text-xs text-stone-600 mb-2 flex-grow">The ratio of the exit area to the throat area, dictating how perfectly the exhaust expands to match ambient pressure.</p>
                                    <div className="bg-stone-50 p-2 rounded border border-stone-100 font-mono text-[11px] text-center overflow-x-auto whitespace-nowrap">
                                        ε = A_e / A_t = 1/M_e * [(2 + (γ-1)M_e²) / (γ+1)]^((γ+1)/(2(γ-1)))
                                    </div>
                                </div>

                                <div className="bg-white p-4 rounded-xl border border-stone-200 shadow-sm sm:col-span-2">
                                    <h6 className="font-bold text-stone-800 text-xs mb-2">Specific Impulse (I_sp)</h6>
                                    <p className="text-xs text-stone-600 mb-2">Measures engine efficiency; defined as thrust per unit weight flow rate of propellant.</p>
                                    <div className="bg-stone-50 p-2 rounded border border-stone-100 font-mono text-xs text-center flex items-center justify-center gap-4">
                                        <span>I_sp = (C_f * c*) / g_0</span>
                                        <span className="text-stone-300">|</span>
                                        <span>F = ṁ * v_e + (p_e - p_a)A_e</span>
                                    </div>
                                    <p className="text-[10px] text-stone-500 mt-2 text-center uppercase font-bold tracking-wider">Where C_f is the Thrust Coefficient and c* is the Characteristic Velocity.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentPage, setCurrentPage] = React.useState('home');
            const [customRocket, setCustomRocket] = React.useState({
                Dc: 0.12, Dt: 0.05, De: 0.11, L_cyl: 0.15, L_conv: 0.06, L_div: 0.14, shape: 'bell'
            });

            const [selectedObstacle, setSelectedObstacle] = React.useState('nozzle');
            const [activeTab, setActiveTab] = React.useState('cfd');

            const handleLoadCFD = () => {
                setSelectedObstacle('customRocket');
                setActiveTab('cfd');
            };

            const navigateToTools = (tab = 'cfd') => {
                setActiveTab(tab);
                setCurrentPage('tools');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <div className="flex flex-col min-h-screen w-full">
                    {/* Navigation Bar */}
                    <nav className="w-full flex justify-between items-center px-4 sm:px-8 py-4 border-b border-stone-200 bg-stone-100/70 backdrop-blur-md sticky top-0 z-50 shadow-sm">
                        <div className="font-extrabold text-xl text-[#2d3628] tracking-tight flex items-center gap-2 cursor-pointer" onClick={() => setCurrentPage('home')}>
                            <span className="bg-[#6b7a57] text-white p-1.5 rounded-lg shadow-sm">CB</span>
                            <span className="hidden sm:inline">Cash Bilton</span>
                        </div>
                        <div className="flex gap-2 sm:gap-4">
                            <button onClick={() => setCurrentPage('home')} 
                                    className={`font-bold text-sm px-4 py-2 rounded-xl transition-all duration-200 ${currentPage === 'home' ? 'bg-[#4a5d3c] text-white shadow-md' : 'text-stone-600 hover:bg-stone-200 hover:text-stone-900'}`}>
                                Home
                            </button>
                            <button onClick={() => setCurrentPage('tools')} 
                                    className={`font-bold text-sm px-4 py-2 rounded-xl transition-all duration-200 ${currentPage === 'tools' ? 'bg-[#4a5d3c] text-white shadow-md' : 'text-stone-600 hover:bg-stone-200 hover:text-stone-900'}`}>
                                Tools Lab
                            </button>
                        </div>
                    </nav>

                    <main className="flex-grow py-12 px-4 sm:px-8 lg:px-16 w-full max-w-[1600px] mx-auto">
                        
                        {currentPage === 'home' ? (
                            <div className="animate-fade">
                                {/* Header */}
                                <header className="mb-14 text-center pt-6">
                                    <div className="inline-block px-5 py-2 bg-stone-100 rounded-full text-stone-500 font-bold text-xs mb-4 uppercase tracking-widest border border-stone-200 shadow-sm">
                                        Graduating Spring 2027
                                    </div>
                                    <h1 className="text-5xl md:text-7xl font-extrabold text-[#2d3628] tracking-tight mb-3 drop-shadow-sm">
                                        Cash Bilton
                                    </h1>
                                    <p className="text-2xl text-[#4a5d3c] font-semibold mx-auto mt-2">
                                        Mechanical Engineering Portfolio
                                    </p>
                                    <p className="text-base text-stone-600 font-medium mx-auto mt-2">
                                        Minors in Aerospace & AERE • Michigan Technological University
                                    </p>
                                </header>

                                {/* Academic Focus Cards */}
                                <section className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-16 max-w-5xl mx-auto">
                                    <div className="glass-panel p-8 rounded-3xl h-full transition hover:scale-[1.01] duration-300">
                                        <h2 className="text-2xl font-bold text-[#2d3628] mb-4">
                                            Academic Focus
                                        </h2>
                                        <p className="text-stone-700 leading-relaxed font-medium text-base">
                                            Dedicated to <strong>Fluid Mechanics, Computational Aerodynamics, and Rocket Propulsion engineering.</strong> 
                                            Building high-performance mathematical solvers and interactive CFD models to analyze supersonic and subsonic fluid interactions.
                                        </p>
                                    </div>

                                    <div className="glass-panel p-8 rounded-3xl h-full transition hover:scale-[1.01] duration-300">
                                        <h2 className="text-2xl font-bold text-[#2d3628] mb-2">
                                            Math Learning Center Coach
                                        </h2>
                                        <h3 className="text-sm text-[#4a5d3c] font-bold mb-3">MTU (Sophomore Year – Present)</h3>
                                        <ul className="text-stone-700 font-medium space-y-2 list-disc pl-5 text-sm">
                                            <li>Mentor undergraduate students in Calculus, Differential Equations, and Matrix Algebra.</li>
                                            <li>Translate core mathematical concepts into applicable engineering solutions.</li>
                                            <li>Encourage analytical critical thinking across engineering departments.</li>
                                        </ul>
                                    </div>
                                </section>

                                {/* Call to action for tools */}
                                <div className="text-center w-full max-w-3xl mx-auto mt-12 bg-stone-200/50 p-8 rounded-3xl border border-stone-200 shadow-inner">
                                    <h3 className="text-2xl font-bold text-[#2d3628] mb-3">Interactive Engineering Applications</h3>
                                    <p className="text-stone-600 mb-6 font-medium">Explore my real-time WebGL fluid simulation and liquid rocket sizing software directly in the browser.</p>
                                    <div className="flex flex-wrap justify-center gap-4">
                                        <button onClick={() => navigateToTools('cfd')} className="px-6 py-3 bg-[#6b7a57] hover:bg-[#4a5d3c] text-white font-bold rounded-xl shadow-md transition transform hover:-translate-y-0.5">
                                            Launch Fluid Solver
                                        </button>
                                        <button onClick={() => navigateToTools('rocket')} className="px-6 py-3 bg-[#e3dcd1] hover:bg-[#d8cfbc] text-stone-800 font-bold rounded-xl shadow-sm transition transform hover:-translate-y-0.5 border border-stone-300">
                                            Launch Rocket Sizer
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="animate-fade w-full flex flex-col items-center">
                                {/* Tools View */}
                                <div className="text-center max-w-3xl mb-8">
                                    <h2 className="text-3xl md:text-4xl font-extrabold text-[#2d3628] mb-3">Engineering Tools Workspace</h2>
                                    <p className="text-base text-stone-600 font-medium">
                                        Select a computational module to begin simulation.
                                    </p>
                                </div>

                                <div className="w-full flex justify-center px-4 mb-0 relative z-10">
                                    <div className="flex bg-stone-200/50 p-1.5 rounded-t-2xl border-t border-x border-stone-200/80 shadow-[0_-4px_10px_rgba(0,0,0,0.02)] space-x-2">
                                        <button onClick={() => setActiveTab('cfd')} 
                                                className={`px-6 md:px-10 py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-all duration-300 ${activeTab === 'cfd' ? 'bg-[#fdfcfb] text-[#2d3628] shadow-sm' : 'text-stone-500 hover:text-stone-700 hover:bg-stone-200'}`}>
                                            GPU Fluid Solver (CFD)
                                        </button>
                                        <button onClick={() => setActiveTab('rocket')} 
                                                className={`px-6 md:px-10 py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-all duration-300 ${activeTab === 'rocket' ? 'bg-[#fdfcfb] text-[#2d3628] shadow-sm' : 'text-stone-500 hover:text-stone-700 hover:bg-stone-200'}`}>
                                            Propulsion Engine Sizer
                                        </button>
                                    </div>
                                </div>

                                <div className="glass-card p-6 md:p-8 w-full rounded-t-none -mt-1 relative z-0">
                                    {activeTab === 'cfd' && (
                                        <div>
                                            <div className="max-w-4xl mb-6">
                                                <h3 className="text-2xl font-bold text-[#2d3628] mb-2">High-Resolution GPU Fluid Solver</h3>
                                                <p className="text-stone-600 text-sm font-medium">Computes 2D incompressible Eulerian Navier-Stokes equations directly in WebGL 2.0 fragment shaders. Features smoke dye streamlines, vorticity confinement, speed distribution, pressure gradients, and Venturi throat flow acceleration.</p>
                                            </div>
                                            <WebGLCFDSimulator 
                                                customRocket={customRocket} 
                                                selectedObstacle={selectedObstacle} 
                                                setSelectedObstacle={setSelectedObstacle} 
                                            />
                                        </div>
                                    )}

                                    {activeTab === 'rocket' && (
                                        <div>
                                            <div className="max-w-4xl mb-6">
                                                <h3 className="text-2xl font-bold text-[#2d3628] mb-2">Liquid Rocket Sizer</h3>
                                                <p className="text-stone-600 text-sm font-medium">Sizes rocket combustion chambers and De Laval convergent-divergent nozzles using multi-propellant thermo-chemical models.</p>
                                            </div>
                                            <RocketEngineSizer 
                                                onUpdateCustomRocket={setCustomRocket} 
                                                onLoadCFD={handleLoadCFD} 
                                            />
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                        
                    </main>

                    {/* Footer */}
                    <footer className="pt-8 pb-10 mt-auto text-center text-stone-500 font-medium flex flex-col items-center justify-center space-y-2 border-t border-stone-200/50">
                        <div className="w-24 h-1 bg-stone-300 rounded-full mb-4"></div>
                        <p className="text-lg font-bold text-[#4a5d3c]">Cash Bilton</p>
                        <p>&copy; {new Date().getFullYear()} All rights reserved.</p>
                        <p className="text-xs text-stone-400">Built with React, WebGL 2 & Tailwind CSS.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
