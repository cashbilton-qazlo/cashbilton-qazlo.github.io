<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanical Engineering Portfolio</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React, ReactDOM, and Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Configure Tailwind for Pastel Aesthetic -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastel: {
                            pink: '#FDF2F8',
                            blue: '#EFF6FF',
                            purple: '#FAF5FF',
                            green: '#F0FDF4',
                            text: '#374151',
                            accent: '#8B5CF6'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for Glassmorphism and Animations -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            /* Soft pastel animated gradient background */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #374151;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism utility class */
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            border-radius: 1.5rem;
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pastel-pink via-pastel-blue to-pastel-purple min-h-screen text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const IconUser = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>;
        const IconBook = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 14l9-5-9-5-9 5 9 5z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 14l9-5-9-5-9 5 9 5zm0 0v6" /></svg>;
        const IconTool = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>;
        const IconMail = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>;

        const Navbar = () => (
            <nav className="fixed top-0 left-0 right-0 z-50 p-4">
                <div className="max-w-5xl mx-auto glass-panel px-6 py-3 flex justify-between items-center">
                    <span className="font-bold text-xl tracking-tight text-indigo-900">[Your Name]</span>
                    <div className="hidden md:flex space-x-6">
                        <a href="#about" className="text-gray-600 hover:text-indigo-600 transition">About</a>
                        <a href="#education" className="text-gray-600 hover:text-indigo-600 transition">Education</a>
                        <a href="#projects" className="text-gray-600 hover:text-indigo-600 transition">Simulations</a>
                        <a href="#contact" className="text-gray-600 hover:text-indigo-600 transition">Contact</a>
                    </div>
                </div>
            </nav>
        );

        const SpringMassDamper = () => {
            const [params, setParams] = useState({ mass: 5, spring: 50, damper: 2 });
            const [position, setPosition] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            
            // Simulation state refs to avoid closure stale data in animation loop
            const state = useRef({ x: 100, v: 0, lastTime: 0 });
            const reqRef = useRef(null);

            const startSimulation = () => {
                state.current = { x: 150, v: 0, lastTime: performance.now() }; // Initial displacement
                setIsPlaying(true);
                if (!reqRef.current) {
                    reqRef.current = requestAnimationFrame(animate);
                }
            };

            const stopSimulation = () => {
                setIsPlaying(false);
                if (reqRef.current) cancelAnimationFrame(reqRef.current);
                reqRef.current = null;
                setPosition(0);
                state.current.x = 0;
            };

            const animate = (time) => {
                const dt = Math.min((time - state.current.lastTime) / 1000, 0.05); // cap dt
                state.current.lastTime = time;

                const { mass, spring, damper } = params;
                const m = Math.max(0.1, mass); // prevent divide by zero
                
                // Spring force: Fs = -k*x
                // Damper force: Fd = -c*v
                // F = ma -> a = (Fs + Fd) / m
                const force = (-spring * state.current.x) - (damper * state.current.v);
                const acceleration = force / m;

                state.current.v += acceleration * dt;
                state.current.x += state.current.v * dt;

                setPosition(state.current.x);

                // Stop if almost at rest
                if (Math.abs(state.current.x) < 0.1 && Math.abs(state.current.v) < 0.1) {
                    setIsPlaying(false);
                    setPosition(0);
                    reqRef.current = null;
                } else {
                    reqRef.current = requestAnimationFrame(animate);
                }
            };

            useEffect(() => {
                return () => { if (reqRef.current) cancelAnimationFrame(reqRef.current); };
            }, []);

            return (
                <div className="glass-panel p-6 flex flex-col items-center">
                    <h3 className="text-xl font-bold mb-4 text-indigo-900">Dynamics: Spring-Mass-Damper</h3>
                    
                    {/* Visualizer Canvas Area */}
                    <div className="w-full h-48 bg-white/40 rounded-xl mb-6 relative overflow-hidden border border-white/50 flex items-center justify-center">
                        <svg width="100%" height="100%" viewBox="0 0 400 200">
                            {/* Wall */}
                            <rect x="0" y="20" width="20" height="160" fill="#9ca3af" />
                            <line x1="20" y1="20" x2="20" y2="180" stroke="#4b5563" strokeWidth="4" />
                            
                            {/* Spring */}
                            <path 
                                d={`M 20 70 L 40 70 L 50 50 L 70 90 L 90 50 L 110 90 L 130 50 L 150 90 L 170 50 L 180 70 L ${200 + position} 70`} 
                                stroke="#8b5cf6" strokeWidth="3" fill="none" 
                                style={{ transformOrigin: '20px 70px', transform: `scaleX(${ (180 + position)/180 })` }}
                            />
                            
                            {/* Damper Cylinder & Piston */}
                            <rect x="20" y="120" width="80" height="20" fill="none" stroke="#6366f1" strokeWidth="2" />
                            <line x1="100" y1="130" x2={200 + position} y2="130" stroke="#6366f1" strokeWidth="3" />
                            <rect x={90 + position*0.5} y="122" width="10" height="16" fill="#6366f1" />

                            {/* Mass Block */}
                            <rect x={200 + position} y="50" width="80" height="100" rx="8" fill="#f472b6" stroke="#db2777" strokeWidth="2" />
                            <text x={240 + position} y="105" textAnchor="middle" fill="white" fontWeight="bold">M = {params.mass}kg</text>
                        </svg>
                    </div>

                    {/* Controls */}
                    <div className="w-full grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <div>
                            <label className="block text-sm font-semibold mb-1">Mass (m): {params.mass}</label>
                            <input type="range" min="1" max="20" value={params.mass} disabled={isPlaying}
                                onChange={(e) => setParams({...params, mass: Number(e.target.value)})} className="w-full accent-pink-500" />
                        </div>
                        <div>
                            <label className="block text-sm font-semibold mb-1">Stiffness (k): {params.spring}</label>
                            <input type="range" min="10" max="200" value={params.spring} disabled={isPlaying}
                                onChange={(e) => setParams({...params, spring: Number(e.target.value)})} className="w-full accent-purple-500" />
                        </div>
                        <div>
                            <label className="block text-sm font-semibold mb-1">Damping (c): {params.damper}</label>
                            <input type="range" min="0" max="15" step="0.5" value={params.damper} disabled={isPlaying}
                                onChange={(e) => setParams({...params, damper: Number(e.target.value)})} className="w-full accent-indigo-500" />
                        </div>
                    </div>

                    <div className="flex gap-4">
                        <button onClick={startSimulation} disabled={isPlaying} 
                            className="px-6 py-2 bg-indigo-500 hover:bg-indigo-600 text-white rounded-full font-medium transition shadow-lg disabled:opacity-50">
                            Displace & Release
                        </button>
                        <button onClick={stopSimulation} disabled={!isPlaying}
                            className="px-6 py-2 bg-pink-500 hover:bg-pink-600 text-white rounded-full font-medium transition shadow-lg disabled:opacity-50">
                            Reset
                        </button>
                    </div>
                </div>
            );
        };

        const BeamDeflectionCalculator = () => {
            const [inputs, setInputs] = useState({
                force: 1000, // Newtons
                length: 2,   // Meters
                elasticity: 200, // GPa (Steel approx)
                inertia: 50  // cm^4
            });

            // Calculate max deflection: delta = (F * L^3) / (3 * E * I)
            // Convert units: E from GPa to Pa (* 10^9), I from cm^4 to m^4 (* 10^-8)
            const calculateDeflection = () => {
                const F = inputs.force;
                const L = inputs.length;
                const E = inputs.elasticity * Math.pow(10, 9); 
                const I = inputs.inertia * Math.pow(10, -8);
                
                if (E === 0 || I === 0) return 0;
                
                const deltaMeters = (F * Math.pow(L, 3)) / (3 * E * I);
                return (deltaMeters * 1000).toFixed(2); // Convert to mm
            };

            const handleInput = (e) => {
                setInputs({ ...inputs, [e.target.name]: Number(e.target.value) });
            };

            const deflection = calculateDeflection();

            return (
                <div className="glass-panel p-6 flex flex-col h-full">
                    <h3 className="text-xl font-bold mb-4 text-indigo-900">Solid Mech: Cantilever Beam Deflection</h3>
                    
                    <div className="grid grid-cols-2 gap-4 mb-6">
                        <div>
                            <label className="block text-xs font-semibold text-gray-500 uppercase">End Load (N)</label>
                            <input type="number" name="force" value={inputs.force} onChange={handleInput} 
                                className="w-full mt-1 p-2 rounded-lg glass-input outline-none focus:border-indigo-400" />
                        </div>
                        <div>
                            <label className="block text-xs font-semibold text-gray-500 uppercase">Length (m)</label>
                            <input type="number" name="length" value={inputs.length} onChange={handleInput} 
                                className="w-full mt-1 p-2 rounded-lg glass-input outline-none focus:border-indigo-400" />
                        </div>
                        <div>
                            <label className="block text-xs font-semibold text-gray-500 uppercase">Modulus E (GPa)</label>
                            <input type="number" name="elasticity" value={inputs.elasticity} onChange={handleInput} 
                                className="w-full mt-1 p-2 rounded-lg glass-input outline-none focus:border-indigo-400" />
                        </div>
                        <div>
                            <label className="block text-xs font-semibold text-gray-500 uppercase">Inertia I (cm⁴)</label>
                            <input type="number" name="inertia" value={inputs.inertia} onChange={handleInput} 
                                className="w-full mt-1 p-2 rounded-lg glass-input outline-none focus:border-indigo-400" />
                        </div>
                    </div>

                    <div className="w-full h-32 bg-white/40 rounded-xl relative overflow-hidden border border-white/50 flex flex-col items-center justify-center p-4">
                        <svg width="100%" height="80%" viewBox="0 0 300 100" className="overflow-visible">
                            {/* Wall */}
                            <rect x="10" y="10" width="20" height="80" fill="#9ca3af" />
                            {/* Original Beam (ghost) */}
                            <line x1="30" y1="50" x2="280" y2="50" stroke="#d1d5db" strokeWidth="8" strokeLinecap="round" strokeDasharray="5,5" />
                            {/* Deflected Beam */}
                            <path d={`M 30 50 Q 150 50 280 ${50 + Math.min(Number(deflection)*2, 40)}`} fill="none" stroke="#6366f1" strokeWidth="8" strokeLinecap="round" />
                            {/* Force Arrow */}
                            <path d={`M 280 ${20 + Math.min(Number(deflection)*2, 40)} L 280 ${40 + Math.min(Number(deflection)*2, 40)}`} stroke="#ef4444" strokeWidth="4" />
                            <polygon points={`275,${40 + Math.min(Number(deflection)*2, 40)} 285,${40 + Math.min(Number(deflection)*2, 40)} 280,${50 + Math.min(Number(deflection)*2, 40)}`} fill="#ef4444" />
                        </svg>
                        <div className="mt-2 text-center">
                            <span className="text-sm text-gray-600 font-semibold">Max Deflection (δ): </span>
                            <span className="text-xl font-bold text-pink-600">{deflection} mm</span>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            return (
                <div className="pt-24 pb-12 px-4 sm:px-6 lg:px-8 max-w-6xl mx-auto font-sans">
                    <Navbar />

                    {/* Hero Section */}
                    <header className="text-center py-16 md:py-24">
                        <div className="inline-block glass-panel px-6 py-2 rounded-full text-indigo-700 font-semibold text-sm mb-6 border-indigo-200">
                            Available for Full-Time Roles | Spring 2027
                        </div>
                        <h1 className="text-5xl md:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-800 to-pink-600 mb-6 drop-shadow-sm">
                            [Your Name Here]
                        </h1>
                        <p className="text-xl md:text-2xl text-gray-700 max-w-2xl mx-auto leading-relaxed">
                            4th-Year Mechanical Engineering Student at <br/>
                            <span className="font-bold text-yellow-600">Michigan Technological University</span>
                        </p>
                    </header>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-16">
                        {/* About Me */}
                        <section id="about" className="glass-panel p-8">
                            <div className="flex items-center mb-4 text-indigo-600">
                                <IconUser />
                                <h2 className="text-2xl font-bold ml-2">About Me</h2>
                            </div>
                            <p className="text-gray-700 leading-relaxed mb-4">
                                As a senior Mechanical Engineering student at Michigan Tech, I am passionate about applying fundamental physics, mechanics, and thermodynamics to solve complex real-world problems. 
                            </p>
                            <p className="text-gray-700 leading-relaxed">
                                My academic journey in Houghton has instilled in me a rigorous work ethic and a deep appreciation for hands-on design, systems modeling, and data-driven analysis. I am actively seeking full-time opportunities where I can contribute to innovative engineering teams.
                            </p>
                        </section>

                        {/* Education */}
                        <section id="education" className="glass-panel p-8">
                            <div className="flex items-center mb-4 text-pink-600">
                                <IconBook />
                                <h2 className="text-2xl font-bold ml-2">Education Timeline</h2>
                            </div>
                            
                            <div className="relative border-l-2 border-pink-200 pl-6 pb-2">
                                <div className="absolute w-4 h-4 bg-pink-400 rounded-full -left-[9px] top-1"></div>
                                <h3 className="font-bold text-lg text-gray-800">Michigan Technological University</h3>
                                <p className="text-indigo-600 font-medium">B.S. in Mechanical Engineering</p>
                                <p className="text-sm text-gray-500 mt-1">Expected Graduation: May 2027</p>
                                <ul className="list-disc list-inside text-sm text-gray-600 mt-3 space-y-1">
                                    <li>Focus areas: Dynamic Systems, Solid Mechanics</li>
                                    <li>[Optional: Insert Minor or Enterprise involvement here]</li>
                                    <li>GPA: [X.XX] / 4.00</li>
                                </ul>
                            </div>
                        </section>
                    </div>

                    <section id="projects" className="mb-16">
                        <div className="flex items-center mb-8 justify-center text-indigo-700">
                            <IconTool />
                            <h2 className="text-3xl font-bold ml-3 text-center">Interactive Engineering Demos</h2>
                        </div>
                        <p className="text-center text-gray-600 mb-8 max-w-2xl mx-auto">
                            A portfolio shouldn't just list skills; it should demonstrate them. Below are self-contained web applications I built to visualize core mechanical concepts.
                        </p>
                        
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <SpringMassDamper />
                            <BeamDeflectionCalculator />
                        </div>
                    </section>

                    <section id="contact" className="glass-panel p-10 text-center max-w-3xl mx-auto mt-24">
                        <div className="flex justify-center text-purple-600 mb-4">
                            <IconMail />
                        </div>
                        <h2 className="text-3xl font-bold mb-4 text-gray-800">Let's Connect</h2>
                        <p className="text-gray-600 mb-8">
                            I am currently open to Entry-Level Mechanical Engineering positions starting Summer 2027. If you think I'd be a good fit for your team, I'd love to hear from you.
                        </p>
                        <div className="flex flex-col sm:flex-row justify-center gap-4">
                            <a href="mailto:[your.email@mtu.edu]" className="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition shadow-lg flex items-center justify-center">
                                Email Me
                            </a>
                            <a href="[Your LinkedIn URL]" target="_blank" className="px-8 py-3 bg-white/50 hover:bg-white/80 border border-indigo-200 text-indigo-900 font-medium rounded-xl transition shadow-sm flex items-center justify-center">
                                LinkedIn Profile
                            </a>
                        </div>
                    </section>
                    
                    <footer className="mt-16 text-center text-sm text-gray-500">
                        &copy; {new Date().getFullYear()} [Your Name]. Built with React & Tailwind CSS.
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
