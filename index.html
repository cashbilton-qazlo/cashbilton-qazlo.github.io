<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Bilton | Aerospace & Mechanical Engineering Portfolio</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Load Babel for JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            /* Woodlands Vibe: Soft tan and pastel green gradients */
            background: linear-gradient(-45deg, #e8ede3, #d6dccc, #e6dec9, #d0d6c4);
            background-size: 400% 400%;
            animation: gradientBG 25s ease infinite;
            color: #2d3628;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Light Glassmorphism Panels */
        .glass-panel {
            background: rgba(250, 249, 246, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 12px 36px 0 rgba(0, 0, 0, 0.05);
        }
        
        .glass-card {
            background: rgba(250, 249, 246, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 14px 40px 0 rgba(74, 93, 60, 0.08);
            border-radius: 1.5rem;
        }

        /* Custom Range Slider - Earthy Tones */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #6b7a57; /* Sage green */
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(107, 122, 87, 0.4);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(107, 122, 87, 0.25);
            border-radius: 2px;
        }

        .cfd-canvas {
            cursor: crosshair;
            touch-action: none;
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #e6dec9;
        }
        ::-webkit-scrollbar-thumb {
            background: #8a9a7a;
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7a57;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ---------------------------------------------------------
        // WebGL2 GPGPU CFD Simulator Component
        // ---------------------------------------------------------
        const WebGLCFDSimulator = ({ customRocket, selectedObstacle, setSelectedObstacle }) => {
            const canvasRef = React.useRef(null);
            const containerRef = React.useRef(null);
            
            // UI State
            const [scene, setScene] = React.useState('windTunnel');
            const [visMode, setVisMode] = React.useState('particles');
            const obstacleType = selectedObstacle;
            const setObstacleType = setSelectedObstacle;
            
            // Physics State
            const [inflowSpeed, setInflowSpeed] = React.useState(2.2);
            const [vorticityBoost, setVorticityBoost] = React.useState(3.0);
            const [solverIters, setSolverIters] = React.useState(30);
            const [dyeRadius, setDyeRadius] = React.useState(0.015);
            
            const [isPaused, setIsPaused] = React.useState(false);
            const [fps, setFps] = React.useState(60);
            const [webglSupported, setWebglSupported] = React.useState(true);

            // Refs for WebGL context and simulation state
            const glRef = React.useRef(null);
            const extRef = React.useRef(null);
            const simStateRef = React.useRef(null);
            const animFrameRef = React.useRef(null);
            const pointerRef = React.useRef({ x: 0, y: 0, dx: 0, dy: 0, isDown: false, moved: false });

            // ---------------------------------------------------------
            // GLSL Shaders
            // ---------------------------------------------------------
            
            // A simple vertex shader used for rendering a full-screen quad
            const baseVertexShader = `
                precision highp float;
                attribute vec2 aPosition;
                varying vec2 vUv;
                varying vec2 vL;
                varying vec2 vR;
                varying vec2 vT;
                varying vec2 vB;
                uniform vec2 texelSize;

                void main () {
                    vUv = aPosition * 0.5 + 0.5;
                    vL = vUv - vec2(texelSize.x, 0.0);
                    vR = vUv + vec2(texelSize.x, 0.0);
                    vT = vUv + vec2(0.0, texelSize.y);
                    vB = vUv - vec2(0.0, texelSize.y);
                    gl_Position = vec4(aPosition, 0.0, 1.0);
                }
            `;

            // Renders the color/dye to the screen based on the visualization mode
            const displayShaderSource = `
                precision highp float;
                precision highp sampler2D;
                varying vec2 vUv;
                varying vec2 vL;
                varying vec2 vR;
                varying vec2 vT;
                varying vec2 vB;
                uniform sampler2D uTexture;
                uniform sampler2D uVelocity;
                uniform sampler2D uObstacle;
                uniform int uVisMode;
                uniform float uInflowSpeed;

                void main () {
                    float obs = texture2D(uObstacle, vUv).x;
                    if (obs > 0.5) {
                        // Color for solid obstacles
                        gl_FragColor = vec4(0.17, 0.20, 0.15, 1.0); // #2c3328
                        return;
                    }

                    if (uVisMode == 0) { // Particles/Dye
                        vec3 c = texture2D(uTexture, vUv).rgb;
                        gl_FragColor = vec4(c, 1.0);
                    } else if (uVisMode == 1) { // Speed
                        vec2 v = texture2D(uVelocity, vUv).xy;
                        float speed = length(v);
                        float normSpeed = clamp(speed / uInflowSpeed, 0.0, 1.0);
                        
                        // Map speed to a colormap (Blue -> Cyan -> Green -> Yellow -> Red)
                        vec3 color = vec3(0.0);
                        if (normSpeed < 0.25) color = mix(vec3(0,0,1), vec3(0,1,1), normSpeed/0.25);
                        else if (normSpeed < 0.5) color = mix(vec3(0,1,1), vec3(0,1,0), (normSpeed-0.25)/0.25);
                        else if (normSpeed < 0.75) color = mix(vec3(0,1,0), vec3(1,1,0), (normSpeed-0.5)/0.25);
                        else color = mix(vec3(1,1,0), vec3(1,0,0), (normSpeed-0.75)/0.25);
                        
                        gl_FragColor = vec4(color, 1.0);
                    } else if (uVisMode == 2) { // Pressure
                        float p = texture2D(uTexture, vUv).x;
                        vec3 color = vec3(0.0);
                        if (p > 0.0) {
                            color = mix(vec3(0.0,0.0,0.0), vec3(1.0, 0.2, 0.2), clamp(p * 5.0, 0.0, 1.0));
                        } else {
                            color = mix(vec3(0.0,0.0,0.0), vec3(0.2, 0.5, 1.0), clamp(-p * 5.0, 0.0, 1.0));
                        }
                        gl_FragColor = vec4(color, 1.0);
                    } else {
                        gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
                    }
                }
            `;

            const curlShaderSource = `
                precision highp float;
                precision highp sampler2D;
                varying highp vec2 vUv;
                varying highp vec2 vL;
                varying highp vec2 vR;
                varying highp vec2 vT;
                varying highp vec2 vB;
                uniform sampler2D uVelocity;

                void main () {
                    float L = texture2D(uVelocity, vL).y;
                    float R = texture2D(uVelocity, vR).y;
                    float T = texture2D(uVelocity, vT).x;
                    float B = texture2D(uVelocity, vB).x;
                    float vorticity = R - L - T + B;
                    gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
                }
            `;

            const vorticityShaderSource = `
                precision highp float;
                precision highp sampler2D;
                varying highp vec2 vUv;
                varying highp vec2 vL;
                varying highp vec2 vR;
                varying highp vec2 vT;
                varying highp vec2 vB;
                uniform sampler2D uVelocity;
                uniform sampler2D uCurl;
                uniform float curl;
                uniform float dt;

                void main () {
                    float L = texture2D(uCurl, vL).x;
                    float R = texture2D(uCurl, vR).x;
                    float T = texture2D(uCurl, vT).x;
                    float B = texture2D(uCurl, vB).x;
                    float C = texture2D(uCurl, vUv).x;
                    
                    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
                    force /= length(force) + 0.0001;
                    force *= curl * C;
                    force.y *= -1.0;
                    
                    vec2 vel = texture2D(uVelocity, vUv).xy;
                    gl_FragColor = vec4(vel + force * dt, 0.0, 1.0);
                }
            `;

            const advectionShaderSource = `
                precision highp float;
                precision highp sampler2D;
                varying vec2 vUv;
                uniform sampler2D uVelocity;
                uniform sampler2D uSource;
                uniform vec2 texelSize;
                uniform vec2 dyeTexelSize;
                uniform float dt;
                uniform float dissipation;
                uniform sampler2D uObstacle;

                // Bilerp interpolation
                vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
                    vec2 st = uv / tsize - 0.5;
                    vec2 iuv = floor(st);
                    vec2 fuv = fract(st);

                    vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
                    vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
                    vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
                    vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);

                    return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
                }

                void main () {
                    float obs = texture2D(uObstacle, vUv).x;
                    if (obs > 0.5) {
                        gl_FragColor = vec4(0.0);
                        return;
                    }
                    vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
                    vec4 result = bilerp(uSource, coord, dyeTexelSize);
                    float decay = 1.0 + dissipation * dt;
                    gl_FragColor = result / decay;
                }
            `;

            const divergenceShaderSource = `
                precision highp float;
                precision highp sampler2D;
                varying highp vec2 vUv;
                varying highp vec2 vL;
                varying highp vec2 vR;
                varying highp vec2 vT;
                varying highp vec2 vB;
                uniform sampler2D uVelocity;
                uniform sampler2D uObstacle;

                void main () {
                    float L = texture2D(uVelocity, vL).x;
                    float R = texture2D(uVelocity, vR).x;
                    float T = texture2D(uVelocity, vT).y;
                    float B = texture2D(uVelocity, vB).y;

                    // Obstacle boundaries
                    float obsL = texture2D(uObstacle, vL).x;
                    float obsR = texture2D(uObstacle, vR).x;
                    float obsT = texture2D(uObstacle, vT).x;
                    float obsB = texture2D(uObstacle, vB).x;
                    
                    vec2 C = texture2D(uVelocity, vUv).xy;
                    if (obsL > 0.5) L = -C.x;
                    if (obsR > 0.5) R = -C.x;
                    if (obsT > 0.5) T = -C.y;
                    if (obsB > 0.5) B = -C.y;

                    float div = 0.5 * (R - L + T - B);
                    gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
                }
            `;

            const pressureShaderSource = `
                precision highp float;
                precision highp sampler2D;
                varying highp vec2 vUv;
                varying highp vec2 vL;
                varying highp vec2 vR;
                varying highp vec2 vT;
                varying highp vec2 vB;
                uniform sampler2D uPressure;
                uniform sampler2D uDivergence;
                uniform sampler2D uObstacle;

                void main () {
                    float L = texture2D(uPressure, vL).x;
                    float R = texture2D(uPressure, vR).x;
                    float T = texture2D(uPressure, vT).x;
                    float B = texture2D(uPressure, vB).x;
                    float C = texture2D(uPressure, vUv).x;
                    float divergence = texture2D(uDivergence, vUv).x;
                    
                    float obsL = texture2D(uObstacle, vL).x;
                    float obsR = texture2D(uObstacle, vR).x;
                    float obsT = texture2D(uObstacle, vT).x;
                    float obsB = texture2D(uObstacle, vB).x;

                    if (obsL > 0.5) L = C;
                    if (obsR > 0.5) R = C;
                    if (obsT > 0.5) T = C;
                    if (obsB > 0.5) B = C;

                    float pressure = (L + R + B + T - divergence) * 0.25;
                    gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
                }
            `;

            const gradientSubtractShaderSource = `
                precision highp float;
                precision highp sampler2D;
                varying highp vec2 vUv;
                varying highp vec2 vL;
                varying highp vec2 vR;
                varying highp vec2 vT;
                varying highp vec2 vB;
                uniform sampler2D uPressure;
                uniform sampler2D uVelocity;
                uniform sampler2D uObstacle;

                void main () {
                    float obs = texture2D(uObstacle, vUv).x;
                    if (obs > 0.5) {
                        gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
                        return;
                    }

                    float L = texture2D(uPressure, vL).x;
                    float R = texture2D(uPressure, vR).x;
                    float T = texture2D(uPressure, vT).x;
                    float B = texture2D(uPressure, vB).x;
                    float C = texture2D(uPressure, vUv).x;
                    
                    float obsL = texture2D(uObstacle, vL).x;
                    float obsR = texture2D(uObstacle, vR).x;
                    float obsT = texture2D(uObstacle, vT).x;
                    float obsB = texture2D(uObstacle, vB).x;

                    if (obsL > 0.5) L = C;
                    if (obsR > 0.5) R = C;
                    if (obsT > 0.5) T = C;
                    if (obsB > 0.5) B = C;

                    vec2 velocity = texture2D(uVelocity, vUv).xy;
                    velocity.xy -= vec2(R - L, T - B) * 0.5;
                    gl_FragColor = vec4(velocity, 0.0, 1.0);
                }
            `;

            const splatShaderSource = `
                precision highp float;
                precision highp sampler2D;
                varying vec2 vUv;
                uniform sampler2D uTarget;
                uniform float aspectRatio;
                uniform vec3 color;
                uniform vec2 point;
                uniform float radius;

                void main () {
                    vec2 p = vUv - point.xy;
                    p.x *= aspectRatio;
                    // Gaussian splat
                    vec3 splat = exp(-dot(p, p) / radius) * color;
                    vec3 base = texture2D(uTarget, vUv).xyz;
                    gl_FragColor = vec4(base + splat, 1.0);
                }
            `;
            
            const inflowShaderSource = `
                precision highp float;
                precision highp sampler2D;
                varying vec2 vUv;
                uniform sampler2D uTarget;
                uniform float uSpeed;
                uniform int uType; // 0 for velocity, 1 for dye

                void main () {
                    vec4 base = texture2D(uTarget, vUv);
                    
                    // Simple constant inflow from the left edge
                    if (vUv.x < 0.02) {
                        if (uType == 0) { // Add horizontal velocity
                            base.x = uSpeed;
                            base.y += sin(vUv.y * 20.0) * 0.1; // Small perturbation
                        } else { // Add dye (smoke)
                            // Colorful smoke bands
                            float r = sin(vUv.y * 30.0) * 0.5 + 0.5;
                            float g = sin(vUv.y * 30.0 + 2.0) * 0.5 + 0.5;
                            float b = sin(vUv.y * 30.0 + 4.0) * 0.5 + 0.5;
                            // Make it a bit more "earthy" to fit theme
                            r = mix(r, 0.4, 0.3);
                            g = mix(g, 0.6, 0.3);
                            b = mix(b, 0.3, 0.3);
                            base = vec4(r, g, b, 1.0);
                        }
                    }
                    gl_FragColor = base;
                }
            `;
            
            // Generates obstacles procedurally on the GPU
            const generateObstacleShaderSource = `
                precision highp float;
                varying vec2 vUv;
                uniform float uAspect;
                uniform int uType; 
                // 0: None, 1: Cylinder, 2: Plate, 3: Airfoil, 4: Nozzle
                
                void main() {
                    float isObs = 0.0;
                    vec2 p = vUv - vec2(0.3, 0.5); // Center offset
                    p.x *= uAspect;

                    if (uType == 1) { // Cylinder
                        if (length(p) < 0.08) isObs = 1.0;
                    } 
                    else if (uType == 2) { // Flat Plate
                        if (abs(p.x) < 0.01 && abs(p.y) < 0.2) isObs = 1.0;
                    }
                    else if (uType == 3) { // Airfoil (Simplified NACA)
                        float chord = 0.3;
                        vec2 ap = p + vec2(chord*0.4, 0.0);
                        float xc = ap.x / chord;
                        if (xc >= 0.0 && xc <= 1.0) {
                            float yt = 0.15 * (0.2969 * sqrt(xc) - 0.1260 * xc - 0.3516 * xc*xc + 0.2843 * xc*xc*xc - 0.1015 * xc*xc*xc*xc) * chord;
                            if (abs(ap.y) <= yt) isObs = 1.0;
                        }
                    }
                    else if (uType == 4) { // Nozzle walls
                        vec2 np = vUv;
                        if (np.x > 0.2 && np.x < 0.8) {
                            float nx = (np.x - 0.2) / 0.6;
                            float wallY = (nx < 0.35) ? (0.16 + (0.35 - nx) * 0.28) : (0.16 + (nx - 0.35) * 0.38);
                            if (np.y < wallY || np.y > 1.0 - wallY) isObs = 1.0;
                        }
                    }
                    
                    // Wind tunnel walls (top and bottom)
                    if (vUv.y < 0.02 || vUv.y > 0.98) isObs = 1.0;

                    gl_FragColor = vec4(isObs, 0.0, 0.0, 1.0);
                }
            `;


            // ---------------------------------------------------------
            // WebGL Utilities
            // ---------------------------------------------------------
            const getWebGLContext = (canvas) => {
                const params = { alpha: true, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false };
                let gl = canvas.getContext('webgl2', params);
                const isWebGL2 = !!gl;
                if (!isWebGL2) {
                    gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
                }
                
                if (gl) {
                    let ext;
                    if (isWebGL2) {
                        gl.getExtension('EXT_color_buffer_float');
                        ext = {
                            formatRGBA: { internalFormat: gl.RGBA16F, format: gl.RGBA },
                            formatRG: { internalFormat: gl.RG16F, format: gl.RG },
                            formatR: { internalFormat: gl.R16F, format: gl.RED },
                            halfFloatTexType: gl.HALF_FLOAT
                        };
                    } else {
                        ext = gl.getExtension('OES_texture_half_float');
                        gl.getExtension('OES_texture_half_float_linear');
                        ext = {
                            formatRGBA: { internalFormat: gl.RGBA, format: gl.RGBA },
                            formatRG: { internalFormat: gl.RGBA, format: gl.RGBA },
                            formatR: { internalFormat: gl.RGBA, format: gl.RGBA },
                            halfFloatTexType: ext.HALF_FLOAT_OES
                        };
                    }
                    return { gl, ext, isWebGL2 };
                }
                return null;
            };

            const compileShader = (gl, type, source) => {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    console.trace(gl.getShaderInfoLog(shader));
                }
                return shader;
            };

            const createProgram = (gl, vertexShader, fragmentShader) => {
                const program = gl.createProgram();
                gl.attachShader(program, vertexShader);
                gl.attachShader(program, fragmentShader);
                gl.linkProgram(program);
                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                    console.trace(gl.getProgramInfoLog(program));
                }
                return program;
            };

            const getUniforms = (gl, program) => {
                let uniforms = [];
                let uniformCount = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
                for (let i = 0; i < uniformCount; i++) {
                    let uniformName = gl.getActiveUniform(program, i).name;
                    uniforms[uniformName] = gl.getUniformLocation(program, uniformName);
                }
                return uniforms;
            };

            class Program {
                constructor(gl, vertexShader, fragmentShaderSource) {
                    this.gl = gl;
                    this.uniforms = {};
                    this.program = createProgram(gl, vertexShader, compileShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource));
                    this.uniforms = getUniforms(gl, this.program);
                }
                bind() { this.gl.useProgram(this.program); }
            }

            const createTexture = (gl, width, height, internalFormat, format, type, param) => {
                const texture = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, width, height, 0, format, type, null);
                return texture;
            };

            const createFBO = (gl, w, h, internalFormat, format, type, param) => {
                gl.activeTexture(gl.TEXTURE0);
                const texture = createTexture(gl, w, h, internalFormat, format, type, param);
                const fbo = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
                gl.viewport(0, 0, w, h);
                gl.clear(gl.COLOR_BUFFER_BIT);
                return { texture, fbo, width: w, height: h, texelSizeX: 1.0 / w, texelSizeY: 1.0 / h };
            };

            const createDoubleFBO = (gl, w, h, internalFormat, format, type, param) => {
                let fbo1 = createFBO(gl, w, h, internalFormat, format, type, param);
                let fbo2 = createFBO(gl, w, h, internalFormat, format, type, param);
                return {
                    width: w, height: h, texelSizeX: fbo1.texelSizeX, texelSizeY: fbo1.texelSizeY,
                    get read() { return fbo1; },
                    set read(value) { fbo1 = value; },
                    get write() { return fbo2; },
                    set write(value) { fbo2 = value; },
                    swap() {
                        let temp = fbo1;
                        fbo1 = fbo2;
                        fbo2 = temp;
                    }
                };
            };

            const blit = (gl, target) => {
                gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
                gl.bindFramebuffer(gl.FRAMEBUFFER, target);
                gl.drawArrays(gl.TRIANGLE_FAN, 0, 4);
            };

            // ---------------------------------------------------------
            // React Lifecycle & Main Simulation Loop
            // ---------------------------------------------------------
            React.useEffect(() => {
                const canvas = canvasRef.current;
                const container = containerRef.current;
                if (!canvas || !container) return;

                const webglContext = getWebGLContext(canvas);
                if (!webglContext) {
                    setWebglSupported(false);
                    return;
                }
                const { gl, ext } = webglContext;
                glRef.current = gl;
                extRef.current = ext;

                // Setup geometry for full-screen quad
                const blitBuffer = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, blitBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
                const blitFunc = (target) => {
                    gl.bindFramebuffer(gl.FRAMEBUFFER, target);
                    gl.drawArrays(gl.TRIANGLE_FAN, 0, 4);
                };

                const baseVertex = compileShader(gl, gl.VERTEX_SHADER, baseVertexShader);
                
                // Init Programs
                const displayProgram = new Program(gl, baseVertex, displayShaderSource);
                const splatProgram = new Program(gl, baseVertex, splatShaderSource);
                const advectionProgram = new Program(gl, baseVertex, advectionShaderSource);
                const divergenceProgram = new Program(gl, baseVertex, divergenceShaderSource);
                const pressureProgram = new Program(gl, baseVertex, pressureShaderSource);
                const gradSubtractProgram = new Program(gl, baseVertex, gradientSubtractShaderSource);
                const generateObstacleProgram = new Program(gl, baseVertex, generateObstacleShaderSource);
                const inflowProgram = new Program(gl, baseVertex, inflowShaderSource);
                
                const curlProgram = new Program(gl, baseVertex, curlShaderSource);
                const vorticityProgram = new Program(gl, baseVertex, vorticityShaderSource);

                gl.bindBuffer(gl.ARRAY_BUFFER, blitBuffer);
                const aPosition = gl.getAttribLocation(displayProgram.program, 'aPosition');
                gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);
                gl.enableVertexAttribArray(aPosition);

                let simRes = 256; 
                let dyeRes = 1024;
                let aspect = 1.0;
                
                let velocity, dye, divergence, pressure, obstacle, curl;

                const initFBOs = () => {
                    const width = container.clientWidth;
                    const height = container.clientHeight;
                    aspect = width / height;
                    
                    canvas.width = width;
                    canvas.height = height;

                    const simW = Math.round(simRes * aspect);
                    const simH = simRes;
                    const dyeW = Math.round(dyeRes * aspect);
                    const dyeH = dyeRes;

                    velocity = createDoubleFBO(gl, simW, simH, ext.formatRGBA.internalFormat, ext.formatRGBA.format, ext.halfFloatTexType, gl.LINEAR);
                    dye = createDoubleFBO(gl, dyeW, dyeH, ext.formatRGBA.internalFormat, ext.formatRGBA.format, ext.halfFloatTexType, gl.LINEAR);
                    divergence = createFBO(gl, simW, simH, ext.formatR.internalFormat, ext.formatR.format, ext.halfFloatTexType, gl.NEAREST);
                    pressure = createDoubleFBO(gl, simW, simH, ext.formatR.internalFormat, ext.formatR.format, ext.halfFloatTexType, gl.NEAREST);
                    obstacle = createFBO(gl, simW, simH, ext.formatR.internalFormat, ext.formatR.format, ext.halfFloatTexType, gl.NEAREST);
                    curl = createFBO(gl, simW, simH, ext.formatR.internalFormat, ext.formatR.format, ext.halfFloatTexType, gl.NEAREST);

                    simStateRef.current = { velocity, dye, divergence, pressure, obstacle, curl, aspect };
                    
                    updateObstacleGeometry();
                };

                const updateObstacleGeometry = () => {
                    if(!obstacle) return;
                    generateObstacleProgram.bind();
                    gl.uniform1f(generateObstacleProgram.uniforms.uAspect, aspect);
                    
                    let typeInt = 0;
                    if(obstacleType === 'cylinder') typeInt = 1;
                    else if(obstacleType === 'flatPlate') typeInt = 2;
                    else if(obstacleType === 'airfoil') typeInt = 3;
                    else if(obstacleType === 'nozzle') typeInt = 4;
                    
                    gl.uniform1i(generateObstacleProgram.uniforms.uType, typeInt);
                    blitFunc(obstacle.fbo);
                };
                
                // Expose obstacle updater
                extRef.current.updateObstacle = updateObstacleGeometry;

                initFBOs();

                // Splat function for interaction
                const splat = (x, y, dx, dy, color) => {
                    if(!velocity || !dye) return;
                    splatProgram.bind();
                    
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
                    gl.uniform1i(splatProgram.uniforms.uTarget, 0); // Correctly target texture unit 0
                    
                    gl.uniform1f(splatProgram.uniforms.aspectRatio, aspect);
                    gl.uniform2f(splatProgram.uniforms.point, x, 1.0 - y);
                    gl.uniform3f(splatProgram.uniforms.color, dx * 50.0, -dy * 50.0, 0.0); // Scale interaction force
                    gl.uniform1f(splatProgram.uniforms.radius, dyeRadius);
                    blitFunc(velocity.write.fbo);
                    velocity.swap();

                    gl.bindTexture(gl.TEXTURE_2D, dye.read.texture);
                    gl.uniform1i(splatProgram.uniforms.uTarget, 0); // Correctly target texture unit 0
                    gl.uniform3f(splatProgram.uniforms.color, color.r, color.g, color.b);
                    blitFunc(dye.write.fbo);
                    dye.swap();
                };
                
                // Apply constant inflow
                const applyInflow = () => {
                     if(!velocity || !dye) return;
                     inflowProgram.bind();
                     
                     // Velocity
                     gl.activeTexture(gl.TEXTURE0);
                     gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
                     gl.uniform1i(inflowProgram.uniforms.uTarget, 0);
                     gl.uniform1f(inflowProgram.uniforms.uSpeed, inflowSpeed * 100.0); // Scale physics speed up to visible bounds
                     gl.uniform1i(inflowProgram.uniforms.uType, 0);
                     blitFunc(velocity.write.fbo);
                     velocity.swap();
                     
                     // Dye
                     gl.bindTexture(gl.TEXTURE_2D, dye.read.texture);
                     gl.uniform1i(inflowProgram.uniforms.uTarget, 0);
                     gl.uniform1i(inflowProgram.uniforms.uType, 1);
                     blitFunc(dye.write.fbo);
                     dye.swap();
                }

                let lastTime = performance.now();
                let frameCount = 0;

                const step = () => {
                    if (isPaused) {
                        animFrameRef.current = requestAnimationFrame(step);
                        return;
                    }

                    const state = simStateRef.current;
                    if(!state) return;
                    const { velocity, dye, divergence, pressure, obstacle, curl } = state;
                    
                    const dt = 0.016;

                    gl.viewport(0, 0, velocity.width, velocity.height);

                    // Add inflow
                    applyInflow();

                    // Advect velocity
                    advectionProgram.bind();
                    gl.uniform2f(advectionProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
                    gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, velocity.texelSizeX, velocity.texelSizeY);
                    gl.uniform1i(advectionProgram.uniforms.uVelocity, 0);
                    gl.uniform1i(advectionProgram.uniforms.uSource, 0);
                    gl.uniform1i(advectionProgram.uniforms.uObstacle, 1);
                    gl.uniform1f(advectionProgram.uniforms.dt, dt);
                    gl.uniform1f(advectionProgram.uniforms.dissipation, 0.0); // No velocity dissipation
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
                    gl.activeTexture(gl.TEXTURE1);
                    gl.bindTexture(gl.TEXTURE_2D, obstacle.texture);
                    blitFunc(velocity.write.fbo);
                    velocity.swap();

                    // Advect dye (smoke)
                    gl.viewport(0, 0, dye.width, dye.height);
                    gl.uniform2f(advectionProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
                    gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, dye.texelSizeX, dye.texelSizeY);
                    gl.uniform1i(advectionProgram.uniforms.uVelocity, 0);
                    gl.uniform1i(advectionProgram.uniforms.uSource, 2);
                    gl.uniform1f(advectionProgram.uniforms.dissipation, 0.5); // Smoke dissipates
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
                    gl.activeTexture(gl.TEXTURE2);
                    gl.bindTexture(gl.TEXTURE_2D, dye.read.texture);
                    blitFunc(dye.write.fbo);
                    dye.swap();

                    // Compute Curl (Vorticity)
                    gl.viewport(0, 0, velocity.width, velocity.height);
                    curlProgram.bind();
                    gl.uniform2f(curlProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
                    gl.uniform1i(curlProgram.uniforms.uVelocity, 0);
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
                    blitFunc(curl.fbo);

                    // Apply Vorticity Confinement
                    vorticityProgram.bind();
                    gl.uniform2f(vorticityProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
                    gl.uniform1i(vorticityProgram.uniforms.uVelocity, 0);
                    gl.uniform1i(vorticityProgram.uniforms.uCurl, 1);
                    gl.uniform1f(vorticityProgram.uniforms.curl, vorticityBoost);
                    gl.uniform1f(vorticityProgram.uniforms.dt, dt);
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
                    gl.activeTexture(gl.TEXTURE1);
                    gl.bindTexture(gl.TEXTURE_2D, curl.texture);
                    blitFunc(velocity.write.fbo);
                    velocity.swap();

                    // Handle interaction splat
                    const ptr = pointerRef.current;
                    if (ptr.isDown && ptr.moved) {
                        splat(ptr.x, ptr.y, ptr.dx, ptr.dy, {r: 0.8, g: 0.9, b: 0.6});
                        ptr.moved = false;
                    }

                    gl.viewport(0, 0, velocity.width, velocity.height);

                    // Compute Divergence
                    divergenceProgram.bind();
                    gl.uniform2f(divergenceProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
                    gl.uniform1i(divergenceProgram.uniforms.uVelocity, 0);
                    gl.uniform1i(divergenceProgram.uniforms.uObstacle, 1);
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
                    gl.activeTexture(gl.TEXTURE1);
                    gl.bindTexture(gl.TEXTURE_2D, obstacle.texture);
                    blitFunc(divergence.fbo);

                    // Solve Pressure
                    pressureProgram.bind();
                    gl.uniform2f(pressureProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
                    gl.uniform1i(pressureProgram.uniforms.uDivergence, 0);
                    gl.uniform1i(pressureProgram.uniforms.uPressure, 2);
                    gl.uniform1i(pressureProgram.uniforms.uObstacle, 1);
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, divergence.texture);
                    gl.activeTexture(gl.TEXTURE1);
                    gl.bindTexture(gl.TEXTURE_2D, obstacle.texture);

                    // Clear pressure
                    gl.activeTexture(gl.TEXTURE2);
                    gl.bindTexture(gl.TEXTURE_2D, pressure.read.texture);
                    gl.bindFramebuffer(gl.FRAMEBUFFER, pressure.read.fbo);
                    gl.clear(gl.COLOR_BUFFER_BIT);

                    // Jacobi iterations
                    for (let i = 0; i < solverIters; i++) {
                        gl.bindTexture(gl.TEXTURE_2D, pressure.read.texture);
                        blitFunc(pressure.write.fbo);
                        pressure.swap();
                    }

                    // Subtract Gradient
                    gradSubtractProgram.bind();
                    gl.uniform2f(gradSubtractProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
                    gl.uniform1i(gradSubtractProgram.uniforms.uPressure, 2);
                    gl.uniform1i(gradSubtractProgram.uniforms.uVelocity, 0);
                    gl.uniform1i(gradSubtractProgram.uniforms.uObstacle, 1);
                    gl.activeTexture(gl.TEXTURE2);
                    gl.bindTexture(gl.TEXTURE_2D, pressure.read.texture);
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
                    gl.activeTexture(gl.TEXTURE1);
                    gl.bindTexture(gl.TEXTURE_2D, obstacle.texture);
                    blitFunc(velocity.write.fbo);
                    velocity.swap();

                    // Render to Screen
                    gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
                    displayProgram.bind();
                    gl.uniform1i(displayProgram.uniforms.uTexture, 0); // dye
                    gl.uniform1i(displayProgram.uniforms.uVelocity, 1);
                    gl.uniform1i(displayProgram.uniforms.uObstacle, 2);
                    
                    let vModeInt = 0;
                    if(visMode === 'speed') vModeInt = 1;
                    else if(visMode === 'pressure') vModeInt = 2;
                    
                    gl.uniform1i(displayProgram.uniforms.uVisMode, vModeInt);
                    gl.uniform1f(displayProgram.uniforms.uInflowSpeed, inflowSpeed * 100.0);

                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, (vModeInt===2) ? pressure.read.texture : dye.read.texture);
                    gl.activeTexture(gl.TEXTURE1);
                    gl.bindTexture(gl.TEXTURE_2D, velocity.read.texture);
                    gl.activeTexture(gl.TEXTURE2);
                    gl.bindTexture(gl.TEXTURE_2D, obstacle.texture);
                    
                    gl.bindFramebuffer(gl.FRAMEBUFFER, null); // Draw to canvas
                    gl.drawArrays(gl.TRIANGLE_FAN, 0, 4);

                    // FPS calc
                    frameCount++;
                    const now = performance.now();
                    if (now - lastTime >= 1000) {
                        setFps(frameCount);
                        frameCount = 0;
                        lastTime = now;
                    }

                    animFrameRef.current = requestAnimationFrame(step);
                };

                animFrameRef.current = requestAnimationFrame(step);

                const handleResize = () => {
                    initFBOs();
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    window.removeEventListener('resize', handleResize);
                    if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
                };
            }, [obstacleType, visMode, inflowSpeed, solverIters, isPaused]); // Added dependencies to re-trigger necessary parts

            // Trigger obstacle update if it changes without full re-mount
            React.useEffect(() => {
                if(extRef.current && extRef.current.updateObstacle) {
                    extRef.current.updateObstacle();
                }
            }, [obstacleType]);

            const handlePointerDown = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                pointerRef.current.isDown = true;
                pointerRef.current.x = (e.clientX - rect.left) / rect.width;
                pointerRef.current.y = (e.clientY - rect.top) / rect.height;
            };

            const handlePointerMove = (e) => {
                if (!pointerRef.current.isDown) return;
                const rect = canvasRef.current.getBoundingClientRect();
                const newX = (e.clientX - rect.left) / rect.width;
                const newY = (e.clientY - rect.top) / rect.height;
                
                pointerRef.current.dx = (newX - pointerRef.current.x) * 10.0;
                pointerRef.current.dy = (newY - pointerRef.current.y) * 10.0;
                pointerRef.current.x = newX;
                pointerRef.current.y = newY;
                pointerRef.current.moved = true;
            };

            const handlePointerUp = () => {
                pointerRef.current.isDown = false;
            };

            if (!webglSupported) {
                return (
                    <div className="w-full p-8 text-center bg-red-50 text-red-800 rounded-xl border border-red-200">
                        <h3 className="font-bold mb-2">WebGL 2 Not Supported</h3>
                        <p>Your browser or device does not support WebGL 2, which is required for the GPU-accelerated fluid simulation.</p>
                    </div>
                );
            }

            return (
                <div id="cfd-viewport" className="flex flex-col lg:flex-row gap-6 w-full mt-4">
                    {/* Control Sidebar */}
                    <div className="w-full lg:w-1/3 flex flex-col gap-5">
                        <div className="bg-stone-50/60 p-5 rounded-2xl border border-stone-200 space-y-4 shadow-sm">
                            <div className="flex items-center justify-between border-b border-stone-200 pb-3">
                                <h4 className="font-bold text-stone-800 text-lg flex items-center gap-2">
                                    <span>GPU Navier-Stokes Solver</span>
                                </h4>
                                <span className="text-xs font-mono bg-stone-200 text-stone-700 border border-stone-300 px-2.5 py-1 rounded-full font-bold">
                                    {fps} FPS
                                </span>
                            </div>

                            {/* Visualization Mode */}
                            <div>
                                <label className="text-xs font-bold uppercase tracking-wider text-stone-500 mb-1 block">Flow Visualization</label>
                                <div className="grid grid-cols-3 gap-1 bg-stone-200/50 p-1 rounded-xl border border-stone-200">
                                    {[
                                        { id: 'particles', label: 'Smoke Dye' },
                                        { id: 'speed', label: 'Velocity' },
                                        { id: 'pressure', label: 'Pressure' },
                                    ].map(v => (
                                        <button key={v.id} onClick={()=>setVisMode(v.id)}
                                                className={`py-1.5 px-1 text-xs font-bold rounded-lg transition ${visMode === v.id ? 'bg-[#6b7a57] text-white shadow-md' : 'text-stone-600 hover:bg-stone-200'}`}>
                                            {v.label}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Obstacle Selection */}
                            <div>
                                <label className="text-xs font-bold uppercase tracking-wider text-stone-500 mb-1 block">Aerodynamic Model</label>
                                <select className="w-full bg-white border border-stone-300 rounded-xl p-2 text-sm font-semibold text-stone-700 focus:outline-none focus:ring-2 focus:ring-[#4a5d3c]"
                                        value={obstacleType} onChange={e=>setObstacleType(e.target.value)}>
                                    <option value="none">Free Laminar Flow</option>
                                    <option value="airfoil">NACA Airfoil Profile</option>
                                    <option value="cylinder">Circular Cylinder</option>
                                    <option value="flatPlate">Flat Plate</option>
                                    <option value="nozzle">CD Rocket Nozzle Duct</option>
                                </select>
                            </div>

                            {/* Physics Sliders */}
                            <div className="space-y-3 pt-2">
                                <label className="flex flex-col text-xs font-semibold text-stone-600">
                                    <span className="flex justify-between">
                                        <span>Freestream Velocity (U∞)</span>
                                        <span className="font-mono text-[#4a5d3c]">{inflowSpeed.toFixed(1)}</span>
                                    </span>
                                    <input type="range" min="0.5" max="8.0" step="0.1" value={inflowSpeed} onChange={e=>setInflowSpeed(Number(e.target.value))}/>
                                </label>

                                <label className="flex flex-col text-xs font-semibold text-stone-600">
                                    <span className="flex justify-between">
                                        <span>Vorticity (Turbulence)</span>
                                        <span className="font-mono text-[#4a5d3c]">{vorticityBoost.toFixed(1)}</span>
                                    </span>
                                    <input type="range" min="0.0" max="15.0" step="0.5" value={vorticityBoost} onChange={e=>setVorticityBoost(Number(e.target.value))}/>
                                </label>

                                <label className="flex flex-col text-xs font-semibold text-stone-600">
                                    <span className="flex justify-between">
                                        <span>Pressure Iterations (Accuracy)</span>
                                        <span className="font-mono text-[#4a5d3c]">{solverIters}</span>
                                    </span>
                                    <input type="range" min="10" max="60" step="5" value={solverIters} onChange={e=>setSolverIters(Number(e.target.value))}/>
                                </label>
                                
                                <label className="flex flex-col text-xs font-semibold text-stone-600">
                                    <span className="flex justify-between">
                                        <span>Interaction Brush Size</span>
                                        <span className="font-mono text-[#4a5d3c]">{dyeRadius.toFixed(3)}</span>
                                    </span>
                                    <input type="range" min="0.005" max="0.05" step="0.005" value={dyeRadius} onChange={e=>setDyeRadius(Number(e.target.value))}/>
                                </label>
                            </div>

                            {/* Controls */}
                            <div className="flex gap-2 pt-2">
                                <button onClick={()=>setIsPaused(!isPaused)} 
                                        className={`flex-1 py-2 rounded-xl font-bold text-xs uppercase tracking-wider transition ${isPaused ? 'bg-[#8a9a7a] hover:bg-[#6b7a57] text-white' : 'bg-[#e3dcd1] hover:bg-[#d8cfbc] text-stone-800'}`}>
                                    {isPaused ? 'Resume' : 'Pause'}
                                </button>
                                <div className="text-xs text-stone-400 italic text-center w-full py-2">
                                    Click & Drag to interact with fluid
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* High Precision Graphics Viewport */}
                    <div ref={containerRef} className="w-full lg:w-2/3 flex flex-col items-center justify-center bg-stone-100/50 rounded-2xl border border-stone-200 p-3 shadow-inner relative overflow-hidden min-h-[400px]">
                        <div className="absolute top-4 left-5 text-xs font-mono bg-stone-900/80 text-[#e6dec9] px-3.5 py-1.5 rounded-full border border-stone-700 z-10 pointer-events-none shadow-sm flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-[#8a9a7a] animate-ping"></span>
                            <span>WebGL2 Compute • GPU Accelerated</span>
                        </div>

                        <canvas ref={canvasRef} 
                                onPointerDown={handlePointerDown}
                                onPointerMove={handlePointerMove}
                                onPointerUp={handlePointerUp}
                                onPointerLeave={handlePointerUp}
                                className="cfd-canvas rounded-xl border border-stone-800/80 shadow-lg bg-[#181d16]" />

                        <div className="w-full flex justify-between items-center px-3 py-2 text-xs text-stone-500 font-mono">
                            <span>Grid Resolution: <strong className="text-stone-700">High (GPU)</strong></span>
                            <span>Engine: <strong className="text-stone-700">GLSL Eulerian Grid</strong></span>
                        </div>
                    </div>
                </div>
            );
        };
        // ---------------------------------------------------------
        // End WebGL Component
        // ---------------------------------------------------------


        const RocketEngineSizer = ({ onUpdateCustomRocket, onLoadCFD }) => {
            const [unit, setUnit] = React.useState('SI');
            const [tab, setTab] = React.useState('combined');

            /* Internal Physics State */
            const [thrustKN, setThrustKN] = React.useState(35);
            const [pcMPa, setPcMPa] = React.useState(4.0);
            const [paKPa, setPaKPa] = React.useState(101.3);
            const [contractionRatio, setContractionRatio] = React.useState(3.5);
            const [propellant, setPropellant] = React.useState('N2O/Ethanol');
            const [nozzleShape, setNozzleShape] = React.useState('bell');

            const [customOF, setCustomOF] = React.useState(4.0);
            const [thetaConv, setThetaConv] = React.useState(30); 
            const [thetaDiv, setThetaDiv] = React.useState(15);  

            const propData = {
                'N2O/Ethanol':   { gamma: 1.23, mw: 25.2, Tc: 3050, Lstar: 1.25, defaultOF: 4.0, name: "N₂O / Ethanol (Nitrous Biprop)" },
                'N2O/Isopropyl': { gamma: 1.22, mw: 26.1, Tc: 2980, Lstar: 1.20, defaultOF: 4.5, name: "N₂O / Isopropyl Alcohol (IPA)" },
                'LOX/RP-1':      { gamma: 1.24, mw: 22.0, Tc: 3670, Lstar: 1.15, defaultOF: 2.56, name: "LOX / RP-1 (Kerosene)" },
                'LOX/LH2':       { gamma: 1.26, mw: 12.0, Tc: 3500, Lstar: 0.85, defaultOF: 6.0, name: "LOX / Liquid Hydrogen" },
                'LOX/CH4':       { gamma: 1.20, mw: 18.0, Tc: 3600, Lstar: 0.95, defaultOF: 3.2, name: "LOX / Methane" },
                'NTO/MMH':       { gamma: 1.21, mw: 23.5, Tc: 3400, Lstar: 0.90, defaultOF: 2.1, name: "NTO / MMH (Hypergolic)" }
            };

            React.useEffect(() => {
                setCustomOF(propData[propellant].defaultOF);
            }, [propellant]);

            const g0 = 9.80665;
            const Ru = 8314.46;

            const fmtLen = (m) => unit === 'SI' ? `${(m*100).toFixed(1)} cm` : `${(m*39.3701).toFixed(2)} in`;
            const fmtMass = (kg_s) => unit === 'SI' ? `${kg_s.toFixed(2)} kg/s` : `${(kg_s*2.20462).toFixed(2)} lb/s`;
            const fmtVel = (m_s) => unit === 'SI' ? `${m_s.toFixed(0)} m/s` : `${(m_s*3.28084).toFixed(0)} ft/s`;

            const calculateEngine = () => {
                const data = propData[propellant];
                const y = data.gamma;
                const R = Ru / data.mw;
                
                const F_N = thrustKN * 1000;
                const Pc_Pa = pcMPa * 1000000;
                const Pa_Pa = paKPa * 1000;

                if (Pc_Pa <= Pa_Pa) return null;

                const pressureRatio = Pc_Pa / Pa_Pa;
                const term1 = Math.max(0, Math.pow(pressureRatio, (y - 1) / y) - 1);
                const Me = Math.sqrt((2 / (y - 1)) * term1);

                const term2 = (2 + (y - 1) * Math.pow(Me, 2)) / (y + 1);
                const epsilon = Math.max(1.0, (1 / (Me || 1)) * Math.pow(term2, (y + 1) / (2 * (y - 1))));

                const Cf = Math.sqrt(
                    ((2 * Math.pow(y, 2)) / (y - 1)) * 
                    Math.pow(2 / (y + 1), (y + 1) / (y - 1)) * 
                    (1 - Math.pow(1 / pressureRatio, (y - 1) / y))
                );

                const cStar = Math.sqrt(y * R * data.Tc) / 
                              (y * Math.sqrt(Math.pow(2 / (y + 1), (y + 1) / (y - 1))));

                const Isp = (Cf * cStar) / g0;

                const At = F_N / (Pc_Pa * Cf);
                const Ae = epsilon * At;
                const Dt = Math.sqrt((4 * At) / Math.PI);
                const De = Math.sqrt((4 * Ae) / Math.PI);
                const mDot = F_N / (Isp * g0);

                const Ac = contractionRatio * At;
                const Dc = Math.sqrt((4 * Ac) / Math.PI);
                const Vc = data.Lstar * At;

                const thetaConvRad = thetaConv * (Math.PI / 180);
                const thetaDivRad = thetaDiv * (Math.PI / 180);

                const L_conv = ((Dc - Dt) / 2) / Math.tan(thetaConvRad);
                const V_conv = (Math.PI / 12) * L_conv * (Math.pow(Dc, 2) + Dc * Dt + Math.pow(Dt, 2));
                
                const V_cyl = Math.max(Vc - V_conv, 0.15 * Vc);
                const L_cyl = V_cyl / Ac;
                const L_div = ((De - Dt) / 2) / Math.tan(thetaDivRad) * (nozzleShape === 'bell' ? 0.8 : 1.0);

                const tau_r = (data.Lstar / cStar) * 1000;

                const mDot_ox = mDot * (customOF / (customOF + 1));
                const mDot_f = mDot * (1 / (customOF + 1));

                return { Me, epsilon, Cf, cStar, Isp, At, Ae, Dt, De, mDot, mDot_ox, mDot_f, Ac, Dc, Vc, L_cyl, L_conv, L_div, tau_r };
            };

            const results = calculateEngine();

            React.useEffect(() => {
                if (results && onUpdateCustomRocket) {
                    onUpdateCustomRocket({
                        Dc: results.Dc,
                        Dt: results.Dt,
                        De: results.De,
                        L_cyl: results.L_cyl,
                        L_conv: results.L_conv,
                        L_div: results.L_div,
                        thetaConv: thetaConv,
                        thetaDiv: thetaDiv,
                        shape: nozzleShape
                    });
                }
            }, [thrustKN, pcMPa, paKPa, contractionRatio, propellant, customOF, thetaConv, thetaDiv, nozzleShape]);

            const UnitSlider = ({ label, si, imp, info }) => {
                const conf = unit === 'SI' ? si : imp;
                return (
                    <label className="flex flex-col gap-1 text-xs font-semibold text-stone-600">
                        <span className="flex justify-between items-end">
                            <span>{label}</span>
                            <span className="font-mono text-[#4a5d3c]">
                                {Number(conf.val).toFixed(conf.step < 1 ? 1 : 0)} {conf.unit}
                            </span>
                        </span>
                        <input type="range" min={conf.min} max={conf.max} step={conf.step} value={conf.val}
                               onChange={e => conf.set(Number(e.target.value))}
                               className="mt-1" />
                        {info && <span className="text-[10px] text-stone-400 font-normal">{info}</span>}
                    </label>
                );
            };

            const OutputBox = ({ label, value, colorClass }) => (
                <div className="bg-stone-50/10 p-2.5 rounded-xl border border-stone-100/10 flex flex-col justify-center shadow-inner">
                    <p className="text-[#c2b8a3] text-[10px] leading-tight mb-1 uppercase tracking-wider">{label}</p>
                    <p className={`text-base md:text-lg font-bold font-mono ${colorClass}`}>{value}</p>
                </div>
            );

            const renderNozzleSVG = () => {
                if (!results) return null;

                const width = 640;
                const height = 340;
                const centerY = height / 2;
                
                const L_total = results.L_cyl + results.L_conv + results.L_div;
                const maxRadius = Math.max(results.De / 2, results.Dc / 2, 0.1);
                
                const marginX = 70; 
                const printW = width - marginX * 2.5;
                const scaleY = (height * 0.28) / maxRadius;
                
                const x_inj = marginX;
                const x_cyl_end = x_inj + (results.L_cyl / L_total) * printW;
                const x_throat = x_cyl_end + (results.L_conv / L_total) * printW;
                const x_exit = x_throat + (results.L_div / L_total) * printW;

                const r_c = (results.Dc / 2) * scaleY;
                const r_t = (results.Dt / 2) * scaleY;
                const r_e = (results.De / 2) * scaleY;

                const chamberTop = `M ${x_inj},${centerY - r_c} L ${x_cyl_end},${centerY - r_c} L ${x_throat},${centerY - r_t}`;
                const chamberBottom = `M ${x_throat},${centerY + r_t} L ${x_cyl_end},${centerY + r_c} L ${x_inj},${centerY + r_c}`;
                
                let nozzleTop = "";
                let nozzleBottom = "";
                
                if (nozzleShape === 'bell') {
                    nozzleTop = `M ${x_throat},${centerY - r_t} C ${x_throat + (x_exit - x_throat)*0.35},${centerY - r_t} ${x_exit - (x_exit - x_throat)*0.3},${centerY - r_e} ${x_exit},${centerY - r_e}`;
                    nozzleBottom = `M ${x_exit},${centerY + r_e} C ${x_exit - (x_exit - x_throat)*0.3},${centerY + r_e} ${x_throat + (x_exit - x_throat)*0.35},${centerY + r_t} ${x_throat},${centerY + r_t}`;
                } else {
                    nozzleTop = `M ${x_throat},${centerY - r_t} L ${x_exit},${centerY - r_e}`;
                    nozzleBottom = `M ${x_exit},${centerY + r_e} L ${x_throat},${centerY + r_t}`;
                }

                const chamberFill = `${chamberTop} ${chamberBottom} Z`;
                const nozzleFill = `${nozzleTop} ${nozzleBottom} Z`;

                const chamberOpacity = (tab === 'chamber' || tab === 'combined') ? 1.0 : 0.15;
                const nozzleOpacity = (tab === 'nozzle' || tab === 'combined') ? 1.0 : 0.15;

                return (
                    <svg className="w-full h-full drop-shadow-sm transition-all duration-300 rounded-xl bg-stone-200/40" viewBox={`0 0 ${width} ${height}`}>
                        <defs>
                            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(107, 122, 87, 0.1)" strokeWidth="1"/>
                            </pattern>
                            <linearGradient id="chamberFlame" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stopColor="#f59e0b" stopOpacity="0.75" /> {/* Amber */}
                                <stop offset="45%" stopColor="#f97316" stopOpacity="0.8" /> {/* Orange */}
                                <stop offset="100%" stopColor="#3b82f6" stopOpacity="0.85" /> {/* Blue */}
                            </linearGradient>
                            <linearGradient id="nozzleFlame" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stopColor="#3b82f6" stopOpacity="0.85" />
                                <stop offset="40%" stopColor="#67e8f9" stopOpacity="0.7" /> 
                                <stop offset="100%" stopColor="#99f6e4" stopOpacity="0.4" /> 
                            </linearGradient>
                            <linearGradient id="plumeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stopColor="#99f6e4" stopOpacity="0.4" />
                                <stop offset="100%" stopColor="#ffffff" stopOpacity="0.0" />
                            </linearGradient>
                        </defs>

                        <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

                        <path d={chamberFill} fill="url(#chamberFlame)" opacity={chamberOpacity} />
                        <path d={nozzleFill} fill="url(#nozzleFlame)" opacity={nozzleOpacity} />
                        <path d={`M ${x_exit},${centerY - r_e} Q ${x_exit + 80},${centerY} ${x_exit},${centerY + r_e} Z`} 
                              fill="url(#plumeGrad)" opacity={nozzleOpacity} />

                        {/* Axis & Planes */}
                        <line x1={x_inj - 20} y1={centerY} x2={x_exit + 40} y2={centerY} stroke="#6b7a57" strokeWidth="1" strokeDasharray="8,6" opacity="0.6" />
                        
                        <line x1={x_inj} y1={centerY - maxRadius - 20} x2={x_inj} y2={centerY + maxRadius + 20} stroke="#8a9a7a" strokeWidth="1" strokeDasharray="4,4" opacity="0.5" />
                        <text x={x_inj} y={centerY - maxRadius - 26} textAnchor="middle" className="text-[10px] fill-stone-600 font-mono tracking-widest">INJ</text>

                        <line x1={x_throat} y1={centerY - maxRadius - 20} x2={x_throat} y2={centerY + maxRadius + 20} stroke="#8a9a7a" strokeWidth="1" strokeDasharray="4,4" opacity="0.5" />
                        <text x={x_throat} y={centerY - maxRadius - 26} textAnchor="middle" className="text-[10px] fill-stone-600 font-mono tracking-widest">THROAT</text>

                        <line x1={x_exit} y1={centerY - maxRadius - 20} x2={x_exit} y2={centerY + maxRadius + 20} stroke="#8a9a7a" strokeWidth="1" strokeDasharray="4,4" opacity="0.5" />
                        <text x={x_exit} y={centerY - maxRadius - 26} textAnchor="middle" className="text-[10px] fill-stone-600 font-mono tracking-widest">EXIT</text>

                        {/* Structural Outlines (Earthy grey-green) */}
                        <path d={chamberTop} fill="none" stroke="#5a684b" strokeWidth="4.5" strokeLinecap="round" opacity={chamberOpacity} />
                        <path d={chamberBottom} fill="none" stroke="#5a684b" strokeWidth="4.5" strokeLinecap="round" opacity={chamberOpacity} />
                        <path d={nozzleTop} fill="none" stroke="#5a684b" strokeWidth="4.5" strokeLinecap="round" opacity={nozzleOpacity} />
                        <path d={nozzleBottom} fill="none" stroke="#5a684b" strokeWidth="4.5" strokeLinecap="round" opacity={nozzleOpacity} />

                        {/* Injector Plate */}
                        <rect x={x_inj - 12} y={centerY - r_c - 8} width="12" height={r_c * 2 + 16} fill="#4a5d3c" rx="4" stroke="#8a9a7a" strokeWidth="2.5" opacity={chamberOpacity} />

                        {/* Angles Overlays */}
                        <g opacity={chamberOpacity}>
                            <line x1={x_cyl_end} y1={centerY - r_c} x2={x_cyl_end + 45} y2={centerY - r_c} stroke="#2d3628" strokeWidth="1.5" strokeDasharray="3,3" />
                            <g transform={`translate(${x_cyl_end + (x_throat - x_cyl_end)*0.4}, ${centerY - r_c - 16})`}>
                                <rect x="-26" y="-12" width="52" height="18" rx="6" fill="#f0ede6" stroke="#8a9a7a" strokeWidth="1" />
                                <text x="0" y="0" textAnchor="middle" className="text-[10px] fill-stone-700 font-mono font-bold">θc: {thetaConv}°</text>
                            </g>
                        </g>

                        <g opacity={nozzleOpacity}>
                            <line x1={x_throat} y1={centerY - r_t} x2={x_throat + 50} y2={centerY - r_t} stroke="#2d3628" strokeWidth="1.5" strokeDasharray="3,3" />
                            <g transform={`translate(${x_throat + (x_exit - x_throat)*0.35}, ${centerY - r_t - 16})`}>
                                <rect x="-26" y="-12" width="52" height="18" rx="6" fill="#f0ede6" stroke="#8a9a7a" strokeWidth="1" />
                                <text x="0" y="0" textAnchor="middle" className="text-[10px] fill-stone-700 font-mono font-bold">θd: {thetaDiv}°</text>
                            </g>
                        </g>

                        {/* Dimension Callouts */}
                        {(tab === 'chamber' || tab === 'combined') && (
                            <>
                                <text x={x_inj + 12} y={centerY - 6} className="text-xs fill-white font-mono font-bold" style={{textShadow: '0 1px 3px rgba(0,0,0,0.8)'}}>Dc: {fmtLen(results.Dc)}</text>
                                <text x={(x_inj + x_cyl_end)/2} y={centerY + r_c + 20} className="text-xs fill-stone-600 font-mono font-bold" textAnchor="middle">Lcyl: {fmtLen(results.L_cyl)}</text>
                            </>
                        )}
                        {(tab === 'nozzle' || tab === 'combined') && (
                            <>
                                <text x={x_throat} y={centerY + r_t + 20} className="text-xs fill-stone-600 font-mono font-bold" textAnchor="middle">Dt: {fmtLen(results.Dt)}</text>
                                <text x={x_exit} y={centerY + r_e + 20} className="text-xs fill-stone-600 font-mono font-bold" textAnchor="middle">De: {fmtLen(results.De)}</text>
                            </>
                        )}
                    </svg>
                );
            };

            return (
                <div className="flex flex-col gap-4 w-full mt-4">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-4 bg-stone-50/60 p-4 rounded-2xl border border-stone-200 shadow-sm">
                        <div className="flex bg-stone-200/60 p-1.5 rounded-xl border border-stone-300 w-full md:w-auto">
                            {[
                                { id: 'chamber', label: 'Chamber Sizer' },
                                { id: 'nozzle', label: 'Nozzle Maker' },
                                { id: 'combined', label: 'Combined System' }
                            ].map(t => (
                                <button key={t.id} onClick={() => setTab(t.id)}
                                        className={`flex-1 md:flex-none py-2 px-4 text-xs font-bold rounded-lg transition ${tab === t.id ? 'bg-[#6b7a57] text-white shadow-md' : 'text-stone-600 hover:bg-stone-100'}`}>
                                    {t.label}
                                </button>
                            ))}
                        </div>
                        
                        <div className="flex items-center gap-3">
                            <span className="text-xs font-bold text-stone-500 uppercase tracking-widest">Units:</span>
                            <div className="flex bg-stone-200/60 p-1 rounded-lg border border-stone-300">
                                <button onClick={() => setUnit('SI')} className={`px-3 py-1.5 text-[10px] font-bold rounded transition ${unit === 'SI' ? 'bg-[#4a5d3c] text-[#e6dec9] shadow-inner' : 'text-stone-500 hover:text-stone-800'}`}>SI Metric</button>
                                <button onClick={() => setUnit('Imperial')} className={`px-3 py-1.5 text-[10px] font-bold rounded transition ${unit === 'Imperial' ? 'bg-[#4a5d3c] text-[#e6dec9] shadow-inner' : 'text-stone-500 hover:text-stone-800'}`}>Imperial</button>
                            </div>
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-6 w-full">
                        <div className="w-full lg:w-1/3 flex flex-col gap-5">
                            <div className="bg-stone-50/60 p-5 rounded-2xl border border-stone-200 space-y-4 shadow-sm">
                                <label className="flex flex-col gap-1 text-xs font-semibold text-stone-600">
                                    <span className="flex justify-between items-end">
                                        <span>Propellant Combination</span>
                                    </span>
                                    <select className="bg-white border border-stone-300 rounded-xl p-2 mt-1 font-mono text-sm text-[#4a5d3c] focus:outline-none focus:ring-2 focus:ring-[#6b7a57]" 
                                            value={propellant} onChange={e=>setPropellant(e.target.value)}>
                                        {Object.entries(propData).map(([key, data]) => (
                                            <option key={key} value={key}>{data.name}</option>
                                        ))}
                                    </select>
                                </label>

                                <label className="flex flex-col gap-1 text-xs font-semibold text-stone-600">
                                    <span className="flex justify-between items-end">
                                        <span>Oxidizer-to-Fuel Ratio (O/F)</span>
                                        <span className="font-mono text-[#4a5d3c]">{customOF.toFixed(2)}</span>
                                    </span>
                                    <input type="range" min="1.0" max="8.0" step="0.05" value={customOF} onChange={e=>setCustomOF(Number(e.target.value))} className="mt-1"/>
                                </label>

                                {(tab === 'nozzle' || tab === 'combined') && (
                                    <>
                                        <label className="flex flex-col gap-1 text-xs font-semibold text-stone-600">
                                            Nozzle Contour Type
                                            <select className="bg-white border border-stone-300 rounded-xl p-2 mt-1 font-mono text-sm text-[#4a5d3c] focus:outline-none focus:ring-2 focus:ring-[#6b7a57]" 
                                                    value={nozzleShape} onChange={e=>setNozzleShape(e.target.value)}>
                                                <option value="bell">Bell (Rao Approximation)</option>
                                                <option value="conical">Conical (15° Half-Angle)</option>
                                            </select>
                                        </label>

                                        <label className="flex flex-col gap-1 text-xs font-semibold text-stone-600">
                                            <span className="flex justify-between items-end">
                                                <span>Convergent Half Angle (θconv)</span>
                                                <span className="font-mono text-[#4a5d3c]">{thetaConv}°</span>
                                            </span>
                                            <input type="range" min="15" max="45" step="1" value={thetaConv} onChange={e=>setThetaConv(Number(e.target.value))} className="mt-1"/>
                                        </label>

                                        <label className="flex flex-col gap-1 text-xs font-semibold text-stone-600">
                                            <span className="flex justify-between items-end">
                                                <span>Divergent Half Angle (θdiv)</span>
                                                <span className="font-mono text-[#4a5d3c]">{thetaDiv}°</span>
                                            </span>
                                            <input type="range" min="8" max="30" step="1" value={thetaDiv} onChange={e=>setThetaDiv(Number(e.target.value))} className="mt-1"/>
                                        </label>
                                    </>
                                )}

                                <UnitSlider 
                                    label="Target Thrust" 
                                    si={{val: thrustKN, min: 2, max: 500, step: 1, unit: 'kN', set: setThrustKN}}
                                    imp={{val: thrustKN * 224.809, min: 500, max: 110000, step: 100, unit: 'lbf', set: (v) => setThrustKN(v / 224.809)}}
                                />

                                <UnitSlider 
                                    label="Chamber Pressure (Pc)" 
                                    si={{val: pcMPa, min: 1, max: 20, step: 0.1, unit: 'MPa', set: setPcMPa}}
                                    imp={{val: pcMPa * 145.038, min: 150, max: 3000, step: 10, unit: 'psi', set: (v) => setPcMPa(v / 145.038)}}
                                />

                                {(tab === 'chamber' || tab === 'combined') && (
                                    <label className="flex flex-col gap-1 text-xs font-semibold text-stone-600">
