<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Bilton | Aerospace & Mechanical Engineering Portfolio</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Load Babel for JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(-45deg, #070a12, #0f172a, #13122c, #070a12);
            background-size: 400% 400%;
            animation: gradientBG 22s ease infinite;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 36px 0 rgba(0, 0, 0, 0.45);
        }
        
        .glass-card {
            background: rgba(15, 23, 42, 0.80);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 14px 40px 0 rgba(0, 0, 0, 0.55);
            border-radius: 1.5rem;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(56, 189, 248, 0.25);
            border-radius: 2px;
        }

        .cfd-canvas {
            cursor: crosshair;
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const CFDSimulator = ({ customRocket, selectedObstacle, setSelectedObstacle }) => {
            /* Control States */
            const [scene, setScene] = React.useState('windTunnel'); /* 'windTunnel', 'supersonic', 'openFlow' */
            const [visMode, setVisMode] = React.useState('particles'); /* 'particles', 'schlieren', 'speed', 'vorticity', 'pressure' */
            const obstacleType = selectedObstacle;
            const setObstacleType = setSelectedObstacle;
            
            /* Flow & Solver Sliders */
            const [obstacleSize, setObstacleSize] = React.useState(26);
            const [aoa, setAoA] = React.useState(10); /* degrees */
            const [inflowSpeed, setInflowSpeed] = React.useState(2.2);
            const [vorticityBoost, setVorticityBoost] = React.useState(3.0);
            const [particleCount, setParticleCount] = React.useState(3500);
            const [solverIters, setSolverIters] = React.useState(28);

            const [isPaused, setIsPaused] = React.useState(false);
            const [fps, setFps] = React.useState(60);

            const displayCanvasRef = React.useRef(null);
            const simRef = React.useRef(null);
            const animFrameRef = React.useRef(null);

            React.useEffect(() => {
                const canvas = displayCanvasRef.current;
                if (!canvas) return;

                /* High DPI Canvas Setup */
                const rect = canvas.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const displayW = Math.floor(rect.width || 900);
                const displayH = Math.floor(displayW * 0.5);

                canvas.width = displayW * dpr;
                canvas.height = displayH * dpr;
                const ctx = canvas.getContext('2d');
                ctx.scale(dpr, dpr);

                /* Simulation Grid Dimensions */
                const GW = 160;
                const GH = 80;
                const gridTotal = GW * GH;

                /* Fluid Dynamics State Grids */
                const u = new Float32Array(gridTotal);
                const v = new Float32Array(gridTotal);
                const u0 = new Float32Array(gridTotal);
                const v0 = new Float32Array(gridTotal);
                const p = new Float32Array(gridTotal);
                const div = new Float32Array(gridTotal);
                const curl = new Float32Array(gridTotal);
                const obstacle = new Uint8Array(gridTotal);

                /* Obstacle Position on Simulation Grid */
                const obsX = Math.floor(GW * 0.30);
                const obsY = Math.floor(GH * 0.50);

                const IX = (x, y) => Math.max(0, Math.min(GW - 1, Math.floor(x))) + Math.max(0, Math.min(GH - 1, Math.floor(y))) * GW;

                /* High-Precision Particle Streamline Engine */
                let particles = [];
                const initParticles = () => {
                    particles = new Array(particleCount);
                    for (let i = 0; i < particleCount; i++) {
                        particles[i] = {
                            x: Math.random() * GW,
                            y: Math.random() * GH,
                            age: Math.random() * 120,
                            life: 60 + Math.random() * 100,
                            history: [],
                            hue: (Math.random() * 60 + 180)
                        };
                    }
                };
                initParticles();

                const updateObstacle = () => {
                    obstacle.fill(0);
                    if (obstacleType === 'none') return;

                    const radAngle = (-aoa * Math.PI) / 180;
                    const cosA = Math.cos(radAngle);
                    const sinA = Math.sin(radAngle);

                    for (let y = 0; y < GH; y++) {
                        for (let x = 0; x < GW; x++) {
                            const dx = x - obsX;
                            const dy = y - obsY;

                            /* Transform into obstacle rotated frame */
                            const rx = dx * cosA - dy * sinA;
                            const ry = dx * sinA + dy * cosA;

                            let inside = false;

                            if (obstacleType === 'designedRocket' && customRocket) {
                                /* Scale custom rocket geometry to CFD grid */
                                const engineXStart = GW * 0.08;
                                const scaleR = GH * 0.32 / (customRocket.Dc || 0.1);
                                
                                const rC = (customRocket.Dc / 2) * scaleR;
                                const rT = (customRocket.Dt / 2) * scaleR;
                                const rE = (customRocket.De / 2) * scaleR;

                                const scaleL = (GW * 0.75) / (customRocket.L_cyl + customRocket.L_conv + customRocket.L_div || 0.3);
                                const lCyl = customRocket.L_cyl * scaleL;
                                const lConv = customRocket.L_conv * scaleL;
                                const lDiv = customRocket.L_div * scaleL;

                                const xCylEnd = engineXStart + lCyl;
                                const xThroat = xCylEnd + lConv;
                                const xExit = xThroat + lDiv;

                                if (x >= engineXStart && x <= xExit) {
                                    let currentRadius = rC;
                                    if (x <= xCylEnd) {
                                        currentRadius = rC;
                                    } else if (x <= xThroat) {
                                        const frac = (x - xCylEnd) / lConv;
                                        currentRadius = rC - frac * (rC - rT);
                                    } else {
                                        const frac = (x - xThroat) / lDiv;
                                        if (customRocket.shape === 'bell') {
                                            /* Parabolic contour for bell approximation */
                                            currentRadius = rT + Math.pow(frac, 0.7) * (rE - rT);
                                        } else {
                                            currentRadius = rT + frac * (rE - rT);
                                        }
                                    }

                                    const wallDist = Math.abs(y - GH / 2);
                                    if (wallDist > currentRadius) {
                                        inside = true;
                                    }
                                }
                            }
                            else if (obstacleType === 'cylinder') {
                                if (dx * dx + dy * dy <= (obstacleSize * 0.45) ** 2) inside = true;
                            } 
                            else if (obstacleType === 'flatPlate') {
                                if (Math.abs(rx) <= obstacleSize * 0.8 && Math.abs(ry) <= 2.2) inside = true;
                            }
                            else if (obstacleType === 'airfoil') {
                                const chord = obstacleSize * 2.2;
                                const xc = (rx + chord * 0.32) / chord;
                                if (xc >= 0 && xc <= 1) {
                                    const yt = 5 * 0.15 * (
                                        0.2969 * Math.sqrt(xc) - 
                                        0.1260 * xc - 
                                        0.3516 * Math.pow(xc, 2) + 
                                        0.2843 * Math.pow(xc, 3) - 
                                        0.1015 * Math.pow(xc, 4)
                                    ) * chord;
                                    if (Math.abs(ry) <= yt) inside = true;
                                }
                            }
                            else if (obstacleType === 'shuttle') {
                                const length = obstacleSize * 2.5;
                                const xc = (rx + length * 0.4) / length;
                                if (xc >= 0 && xc <= 1) {
                                    const width = Math.sin(xc * Math.PI) * (obstacleSize * 0.45);
                                    if (Math.abs(ry) <= width) inside = true;
                                }
                            }
                            else if (obstacleType === 'nozzle') {
                                const nw = GW * 0.55;
                                if (x >= obsX - nw/2 && x <= obsX + nw/2) {
                                    const nx = (x - (obsX - nw/2)) / nw;
                                    let wallY = (nx < 0.35) ? (GH * 0.16 + (0.35 - nx) * GH * 0.28) : (GH * 0.16 + (nx - 0.35) * GH * 0.38);
                                    if (y < wallY || y > GH - wallY) inside = true;
                                }
                            }

                            if (inside) obstacle[IX(x, y)] = 1;
                        }
                    }
                };

                updateObstacle();

                const sampleVelocity = (px, py) => {
                    const x0 = Math.max(0, Math.min(GW - 2, Math.floor(px)));
                    const y0 = Math.max(0, Math.min(GH - 2, Math.floor(py)));
                    const fx = px - x0;
                    const fy = py - y0;

                    const i00 = IX(x0, y0);
                    const i10 = IX(x0 + 1, y0);
                    const i01 = IX(x0, y0 + 1);
                    const i11 = IX(x0 + 1, y0 + 1);

                    const vx = (1 - fx) * ((1 - fy) * u[i00] + fy * u[i01]) + fx * ((1 - fy) * u[i10] + fy * u[i11]);
                    const vy = (1 - fx) * ((1 - fy) * v[i00] + fy * v[i01]) + fx * ((1 - fy) * v[i0, j0]);

                    return [vx, vy];
                };

                /* Advect Step */
                const advect = (field, field0, dt) => {
                    for (let y = 1; y < GH - 1; y++) {
                        for (let x = 1; x < GW - 1; x++) {
                            const idx = IX(x, y);
                            if (obstacle[idx]) { field[idx] = 0; continue; }

                            let prevX = x - dt * u[idx];
                            let prevY = y - dt * v[idx];

                            prevX = Math.max(0.5, Math.min(GW - 1.5, prevX));
                            prevY = Math.max(0.5, Math.min(GH - 1.5, prevY));

                            const i0 = Math.floor(prevX);
                            const i1 = i0 + 1;
                            const j0 = Math.floor(prevY);
                            const j1 = j0 + 1;

                            const s1 = prevX - i0;
                            const s0 = 1 - s1;
                            const t1 = prevY - j0;
                            const t0 = 1 - t1;

                            field[idx] = s0 * (t0 * field0[IX(i0, j0)] + t1 * field0[IX(i0, j1)]) +
                                         s1 * (t0 * field0[IX(i1, j0)] + t1 * field0[IX(i1, j1)]);
                        }
                    }
                };

                const project = () => {
                    for (let y = 1; y < GH - 1; y++) {
                        for (let x = 1; x < GW - 1; x++) {
                            const idx = IX(x, y);
                            if (obstacle[idx]) { div[idx] = 0; p[idx] = 0; continue; }
                            div[idx] = -0.5 * (u[IX(x + 1, y)] - u[IX(x - 1, y)] + v[IX(x, y + 1)] - v[IX(x, y - 1)]);
                            p[idx] = 0;
                        }
                    }

                    for (let k = 0; k < solverIters; k++) {
                        for (let y = 1; y < GH - 1; y++) {
                            for (let x = 1; x < GW - 1; x++) {
                                const idx = IX(x, y);
                                if (obstacle[idx]) continue;
                                p[idx] = (div[idx] + p[IX(x + 1, y)] + p[IX(x - 1, y)] + p[IX(x, y + 1)] + p[IX(x, y - 1)]) / 4;
                            }
                        }
                    }

                    for (let y = 1; y < GH - 1; y++) {
                        for (let x = 1; x < GW - 1; x++) {
                            const idx = IX(x, y);
                            if (obstacle[idx]) { u[idx] = 0; v[idx] = 0; continue; }
                            u[idx] -= 0.5 * (p[IX(x + 1, y)] - p[IX(x - 1, y)]);
                            v[idx] -= 0.5 * (p[IX(x, y + 1)] - p[IX(x, y - 1)]);
                        }
                    }
                };

                const applyVorticity = () => {
                    for (let y = 1; y < GH - 1; y++) {
                        for (let x = 1; x < GW - 1; x++) {
                            const idx = IX(x, y);
                            curl[idx] = (v[IX(x + 1, y)] - v[IX(x - 1, y)]) - (u[IX(x, y + 1)] - u[IX(x, y - 1)]);
                        }
                    }

                    if (vorticityBoost <= 0) return;

                    for (let y = 2; y < GH - 2; y++) {
                        for (let x = 2; x < GW - 2; x++) {
                            const idx = IX(x, y);
                            if (obstacle[idx]) continue;

                            const dw_dx = (Math.abs(curl[IX(x + 1, y)]) - Math.abs(curl[IX(x - 1, y)])) * 0.5;
                            const dw_dy = (Math.abs(curl[IX(x, y + 1)]) - Math.abs(curl[IX(x, y - 1)])) * 0.5;

                            let len = Math.sqrt(dw_dx * dw_dx + dw_dy * dw_dy) + 1e-5;
                            const nx = dw_dx / len;
                            const ny = dw_dy / len;

                            u[idx] += nx * curl[idx] * vorticityBoost * 0.035;
                            v[idx] += ny * curl[idx] * vorticityBoost * 0.035;
                        }
                    }
                };

                let timeOffset = 0;
                const applyInflow = () => {
                    timeOffset += 0.05;
                    for (let y = 0; y < GH; y++) {
                        const isWall = (scene === 'windTunnel') && (y === 0 || y === GH - 1);
                        for (let x = 0; x < 3; x++) {
                            const idx = IX(x, y);
                            if (isWall) {
                                u[idx] = 0; v[idx] = 0;
                            } else {
                                u[idx] = inflowSpeed * (scene === 'supersonic' ? 2.4 : 1.0);
                                v[idx] = Math.sin(timeOffset + y * 0.3) * inflowSpeed * 0.03;
                            }
                        }
                    }
                };

                const render = () => {
                    ctx.clearRect(0, 0, displayW, displayH);

                    const scaleX = displayW / GW;
                    const scaleY = displayH / GH;

                    if (visMode !== 'particles') {
                        let currMaxSpd = 0.001, currMaxCurl = 0.001, currMaxP = 0.001;
                        
                        for (let i = 0; i < gridTotal; i++) {
                            if (obstacle[i]) continue;
                            if (visMode === 'speed') {
                                const s = u[i]*u[i] + v[i]*v[i];
                                if (s > currMaxSpd) currMaxSpd = s;
                            } else if (visMode === 'vorticity') {
                                const c = Math.abs(curl[i]);
                                if (c > currMaxCurl) currMaxCurl = c;
                            } else if (visMode === 'pressure') {
                                const pr = Math.abs(p[i]);
                                if (pr > currMaxP) currMaxP = pr;
                            }
                        }
                        
                        currMaxSpd = Math.sqrt(currMaxSpd);

                        rollingMaxSpd = rollingMaxSpd * 0.92 + currMaxSpd * 0.08;
                        rollingMaxCurl = rollingMaxCurl * 0.92 + currMaxCurl * 0.08;
                        rollingMaxP = rollingMaxP * 0.92 + currMaxP * 0.08;

                        const scaleSpd = Math.max(0.1, rollingMaxSpd);
                        const scaleCurl = Math.max(0.1, rollingMaxCurl);
                        const scaleP = Math.max(0.1, rollingMaxP);

                        const cellW = Math.ceil(scaleX);
                        const cellH = Math.ceil(scaleY);

                        for (let y = 0; y < GH; y++) {
                            for (let x = 0; x < GW; x++) {
                                const idx = IX(x, y);
                                if (obstacle[idx]) continue;

                                let fillStyle = '#000000';

                                if (visMode === 'speed') {
                                    const spd = Math.sqrt(u[idx] ** 2 + v[idx] ** 2);
                                    const norm = Math.min(1.0, spd / scaleSpd);
                                    const hue = (1.0 - norm) * 240; 
                                    fillStyle = `hsla(${hue}, 100%, ${20 + norm * 40}%, 0.85)`;
                                }
                                else if (visMode === 'vorticity') {
                                    const norm = Math.max(-1, Math.min(1, curl[idx] / scaleCurl));
                                    if (norm > 0) { 
                                        fillStyle = `rgba(${Math.floor(norm * 255)}, ${Math.floor(norm * 100)}, 0, 0.85)`;
                                    } else { 
                                        const v2 = -norm;
                                        fillStyle = `rgba(0, ${Math.floor(v2 * 150)}, ${Math.floor(v2 * 255)}, 0.85)`;
                                    }
                                }
                                else if (visMode === 'pressure') {
                                    const norm = Math.max(-1, Math.min(1, p[idx] / scaleP));
                                    if (norm > 0) { 
                                        fillStyle = `rgba(${Math.floor(norm * 255)}, ${Math.floor(norm * 40)}, ${Math.floor(norm * 40)}, 0.85)`;
                                    } else { 
                                        const np = -norm;
                                        fillStyle = `rgba(${Math.floor(np * 40)}, ${Math.floor(np * 100)}, ${Math.floor(np * 255)}, 0.85)`;
                                    }
                                }
                                else if (visMode === 'schlieren') {
                                    const gradU = Math.abs(u[IX(Math.min(GW-1, x+1), y)] - u[IX(Math.max(0, x-1), y)]);
                                    const gradV = Math.abs(v[IX(x, Math.min(GH-1, y+1))] - v[IX(x, Math.max(0, y-1))]);
                                    const mag = Math.min(1.0, (gradU + gradV) / (scaleCurl * 0.8 + 0.1));
                                    const val = Math.floor((1 - mag) * 245);
                                    fillStyle = `rgb(${val}, ${val}, ${val})`;
                                }

                                ctx.fillStyle = fillStyle;
                                ctx.fillRect(x * scaleX, y * scaleY, cellW + 0.5, cellH + 0.5);
                            }
                        }
                    }

                    /* Smooth Particle Streamlines */
                    ctx.lineWidth = (visMode === 'particles') ? 1.4 : 1.0;
                    ctx.lineCap = 'round';

                    for (let i = 0; i < particles.length; i++) {
                        const pt = particles[i];

                        const [vx1, vy1] = sampleVelocity(pt.x, pt.y);
                        const [vx2, vy2] = sampleVelocity(pt.x + vx1 * 0.5, pt.y + vy1 * 0.5);

                        const pxNew = pt.x + vx2 * 0.8;
                        const pyNew = pt.y + vy2 * 0.8;

                        const isBlocked = obstacle[IX(pxNew, pyNew)];
                        if (pxNew >= GW - 1 || pxNew <= 0 || pyNew >= GH - 1 || pyNew <= 0 || isBlocked || pt.age > pt.life) {
                            pt.x = Math.random() * 4;
                            pt.y = Math.random() * GH;
                            pt.age = 0;
                            pt.history = [];
                            pt.hue = (pt.y / GH) * 160 + 170;
                            continue;
                        }

                        pt.history.push({ x: pt.x * scaleX, y: pt.y * scaleY });
                        if (pt.history.length > 8) pt.history.shift();

                        pt.x = pxNew;
                        pt.y = pyNew;
                        pt.age++;

                        if (pt.history.length > 1) {
                            ctx.beginPath();
                            ctx.moveTo(pt.history[0].x, pt.history[0].y);
                            for (let h = 1; h < pt.history.length; h++) {
                                ctx.lineTo(pt.history[h].x, pt.history[h].y);
                            }

                            const speedMag = Math.sqrt(vx2 * vx2 + vy2 * vy2);
                            const alpha = Math.min(1.0, (pt.age / 10)) * (1 - pt.age / pt.life);

                            if (visMode === 'particles') {
                                ctx.strokeStyle = `hsla(${pt.hue + speedMag * 15}, 95%, 60%, ${alpha * 0.85})`;
                            } else {
                                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.4})`;
                            }
                            ctx.stroke();
                        }
                    }

                    /* Render Solid Obstacle Geometry smoothly */
                    ctx.save();
                    ctx.fillStyle = '#0f172a';
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 2.5;
                    ctx.shadowColor = 'rgba(56, 189, 248, 0.6)';
                    ctx.shadowBlur = 12;

                    const S = scaleX; 
                    
                    if (obstacleType !== 'none') {
                        ctx.beginPath();
                        
                        if (obstacleType === 'designedRocket' && customRocket) {
                            const engineXStart = GW * 0.08 * S;
                            const scaleR = (GH * 0.32 * scaleY) / (customRocket.Dc || 0.1);
                            
                            const rC = (customRocket.Dc / 2) * scaleR;
                            const rT = (customRocket.Dt / 2) * scaleR;
                            const rE = (customRocket.De / 2) * scaleR;

                            const scaleL = (GW * 0.75 * S) / (customRocket.L_cyl + customRocket.L_conv + customRocket.L_div || 0.3);
                            const lCyl = customRocket.L_cyl * scaleL;
                            const lConv = customRocket.L_conv * scaleL;
                            const lDiv = customRocket.L_div * scaleL;

                            const xCylEnd = engineXStart + lCyl;
                            const xThroat = xCylEnd + lConv;
                            const xExit = xThroat + lDiv;

                            const centerY = (GH / 2) * scaleY;

                            /* Top Wall Outer Block */
                            ctx.rect(engineXStart, 0, xExit - engineXStart, centerY - rC);
                            ctx.moveTo(engineXStart, centerY - rC);
                            ctx.lineTo(xCylEnd, centerY - rC);
                            ctx.lineTo(xThroat, centerY - rT);
                            
                            if (customRocket.shape === 'bell') {
                                for(let i=1; i<=30; i++) {
                                    const frac = i/30;
                                    const rx = xThroat + frac * lDiv;
                                    const ry = centerY - (rT + Math.pow(frac, 0.7) * (rE - rT));
                                    ctx.lineTo(rx, ry);
                                }
                            } else {
                                ctx.lineTo(xExit, centerY - rE);
                            }
                            ctx.lineTo(xExit, 0); ctx.lineTo(engineXStart, 0); ctx.closePath();

                            /* Bottom Wall Outer Block */
                            ctx.rect(engineXStart, centerY + rC, xExit - engineXStart, displayH - (centerY + rC));
                            ctx.moveTo(engineXStart, centerY + rC);
                            ctx.lineTo(xCylEnd, centerY + rC);
                            ctx.lineTo(xThroat, centerY + rT);
                            
                            if (customRocket.shape === 'bell') {
                                for(let i=1; i<=30; i++) {
                                    const frac = i/30;
                                    const rx = xThroat + frac * lDiv;
                                    const ry = centerY + (rT + Math.pow(frac, 0.7) * (rE - rT));
                                    ctx.lineTo(rx, ry);
                                }
                            } else {
                                ctx.lineTo(xExit, centerY + rE);
                            }
                            ctx.lineTo(xExit, displayH); ctx.lineTo(engineXStart, displayH); ctx.closePath();

                        } else if (obstacleType === 'nozzle') {
                            const nw = GW * 0.55 * S;
                            const noxX = obsX * S;
                            
                            for (let i = 0; i <= 50; i++) {
                                const nx = i / 50;
                                const gridX = (noxX - nw/2) + nx * nw;
                                let wallY = (nx < 0.35) ? (GH * 0.16 + (0.35 - nx) * GH * 0.28) : (GH * 0.16 + (nx - 0.35) * GH * 0.38);
                                ctx.lineTo(gridX, wallY * S);
                            }
                            ctx.lineTo(noxX + nw/2, 0); ctx.lineTo(noxX - nw/2, 0);
                            ctx.closePath();
                            ctx.fill(); ctx.stroke();
                            
                            ctx.beginPath();
                            for (let i = 0; i <= 50; i++) {
                                const nx = i / 50;
                                const gridX = (noxX - nw/2) + nx * nw;
                                let wallY = (nx < 0.35) ? (GH * 0.16 + (0.35 - nx) * GH * 0.28) : (GH * 0.16 + (nx - 0.35) * GH * 0.38);
                                ctx.lineTo(gridX, (GH - wallY) * S);
                            }
                            ctx.lineTo(noxX + nw/2, GH * S); ctx.lineTo(noxX - nw/2, GH * S);
                            ctx.closePath();
                            
                        } else {
                            ctx.translate(obsX * S, obsY * scaleY);
                            ctx.rotate((aoa * Math.PI) / 180);

                            if (obstacleType === 'cylinder') {
                                ctx.arc(0, 0, obstacleSize * 0.45 * S, 0, Math.PI * 2);
                            } 
                            else if (obstacleType === 'flatPlate') {
                                const w = obstacleSize * 0.8 * S;
                                const h = 2.2 * scaleY;
                                ctx.rect(-w, -h, w * 2, h * 2);
                            }
                            else if (obstacleType === 'airfoil') {
                                const chord = obstacleSize * 2.2 * S;
                                const cx = -chord * 0.32;
                                const naca = (xc) => 5 * 0.15 * (0.2969 * Math.sqrt(xc) - 0.1260 * xc - 0.3516 * Math.pow(xc, 2) + 0.2843 * Math.pow(xc, 3) - 0.1015 * Math.pow(xc, 4));
                                for (let i = 0; i <= 50; i++) {
                                    const xc = i / 50;
                                    ctx.lineTo(cx + xc * chord, -(naca(xc) * chord));
                                }
                                for (let i = 50; i >= 0; i--) {
                                    const xc = i / 50;
                                    ctx.lineTo(cx + xc * chord, (naca(xc) * chord));
                                }
                                ctx.closePath();
                            }
                            else if (obstacleType === 'shuttle') {
                                const length = obstacleSize * 2.5 * S;
                                const cx = -length * 0.4;
                                for (let i = 0; i <= 50; i++) {
                                    const xc = i / 50;
                                    const yt = Math.sin(xc * Math.PI) * (obstacleSize * 0.45 * scaleY);
                                    ctx.lineTo(cx + xc * length, -yt);
                                }
                                for (let i = 50; i >= 0; i--) {
                                    const xc = i / 50;
                                    const yt = Math.sin(xc * Math.PI) * (obstacleSize * 0.45 * scaleY);
                                    ctx.lineTo(cx + xc * length, yt);
                                }
                                ctx.closePath();
                            }
                        }

                        ctx.fill();
                        ctx.stroke();
                    }
                    ctx.restore();

                    if (scene === 'windTunnel') {
                        ctx.strokeStyle = 'rgba(148, 163, 184, 0.5)';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(0, 2); ctx.lineTo(displayW, 2);
                        ctx.moveTo(0, displayH - 2); ctx.lineTo(displayW, displayH - 2);
                        ctx.stroke();
                    }
                };

                let lastTime = performance.now();
                let frameCount = 0;

                const step = () => {
                    if (!isPaused) {
                        applyInflow();

                        u0.set(u); v0.set(v);
                        advect(u, u0, 1.0);
                        advect(v, v0, 1.0);

                        applyVorticity();
                        project();

                        render();
                    }

                    frameCount++;
                    const now = performance.now();
                    if (now - lastTime >= 1000) {
                        setFps(frameCount);
                        frameCount = 0;
                        lastTime = now;
                    }

                    animFrameRef.current = requestAnimationFrame(step);
                };

                animFrameRef.current = requestAnimationFrame(step);

                simRef.current = {
                    reset: () => {
                        u.fill(0); v.fill(0); p.fill(0);
                        initParticles();
                    },
                    stir: (cx, cy, radius, forceX, forceY) => {
                        const gx = Math.floor((cx / displayW) * GW);
                        const gy = Math.floor((cy / displayH) * GH);
                        const rGrid = Math.floor(radius);

                        for (let y = gy - rGrid; y <= gy + rGrid; y++) {
                            for (let x = gx - rGrid; x <= gx + rGrid; x++) {
                                if (x >= 0 && x < GW && y >= 0 && y < GH) {
                                    const idx = IX(x, y);
                                    u[idx] += forceX * 0.25;
                                    v[idx] += forceY * 0.25;
                                }
                            }
                        }
                    }
                };

                return () => {
                    if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
                };
            }, [scene, visMode, obstacleType, obstacleSize, aoa, inflowSpeed, vorticityBoost, particleCount, solverIters, isPaused, customRocket]);

            const handleCanvasPointer = (e) => {
                if (!displayCanvasRef.current || !simRef.current) return;
                const rect = displayCanvasRef.current.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                if (e.buttons === 1) {
                    simRef.current.stir(x, y, 10, e.movementX, e.movementY);
                }
            };

            return (
                <div id="cfd-viewport" className="flex flex-col lg:flex-row gap-6 w-full p-2">
                    {/* Control Sidebar */}
                    <div className="w-full lg:w-1/3 flex flex-col gap-5">
                        <div className="bg-slate-900/85 p-5 rounded-2xl border border-slate-700/80 space-y-4 shadow-xl">
                            <div className="flex items-center justify-between border-b border-slate-700/60 pb-3">
                                <h4 className="font-bold text-sky-400 text-lg flex items-center gap-2">
                                    <span>🌊 CFD Vector Fluid Solver</span>
                                </h4>
                                <span className="text-xs font-mono bg-sky-950 text-sky-300 border border-sky-800 px-2.5 py-1 rounded-full font-bold">
                                    {fps} FPS
                                </span>
                            </div>

                            {/* Scene Mode */}
                            <div>
                                <label className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1 block">Test Environment</label>
                                <div className="grid grid-cols-3 gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                                    {['windTunnel', 'supersonic', 'openFlow'].map(m => (
                                        <button key={m} onClick={()=>setScene(m)}
                                                className={`py-1.5 px-2 text-xs font-bold rounded-lg capitalize transition ${scene === m ? 'bg-sky-500 text-slate-950 shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                            {m === 'windTunnel' ? 'Wind Tunnel' : m === 'supersonic' ? 'Supersonic' : 'Free Stream'}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Visualization Mode */}
                            <div>
                                <label className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1 block">Flow Visualization</label>
                                <div className="grid grid-cols-3 gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                                    {[
                                        { id: 'particles', label: 'Smoke Trails' },
                                        { id: 'speed', label: 'Velocity' },
                                        { id: 'vorticity', label: 'Vorticity' },
                                        { id: 'pressure', label: 'Pressure' },
                                        { id: 'schlieren', label: 'Schlieren' }
                                    ].map(v => (
                                        <button key={v.id} onClick={()=>setVisMode(v.id)}
                                                className={`py-1.5 px-1 text-xs font-bold rounded-lg transition ${visMode === v.id ? 'bg-indigo-500 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                            {v.label}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Obstacle Selection */}
                            <div>
                                <label className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1 block">Aerodynamic Model</label>
                                <select className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-sm font-semibold text-sky-300 focus:outline-none focus:ring-2 focus:ring-sky-500"
                                        value={obstacleType} onChange={e=>setObstacleType(e.target.value)}>
                                    <option value="designedRocket">🚀 Custom Designed Rocket Engine (Active Sizer)</option>
                                    <option value="airfoil">NACA Airfoil Profile</option>
                                    <option value="shuttle">Space Plane / Shuttle</option>
                                    <option value="cylinder">Circular Cylinder (Vortex Shedding)</option>
                                    <option value="flatPlate">Flat Plate / Normal Deflector</option>
                                    <option value="nozzle">CD Rocket Nozzle Duct</option>
                                    <option value="none">Free Laminar Flow</option>
                                </select>
                            </div>

                            {/* Physics Sliders */}
                            <div className="space-y-3 pt-2">
                                <label className="flex flex-col text-xs font-semibold text-slate-300">
                                    <span className="flex justify-between">
                                        <span>Freestream Velocity (U∞)</span>
                                        <span className="font-mono text-sky-400">{inflowSpeed.toFixed(1)}</span>
                                    </span>
                                    <input type="range" min="0.5" max="4.5" step="0.1" value={inflowSpeed} onChange={e=>setInflowSpeed(Number(e.target.value))}/>
                                </label>

                                <label className="flex flex-col text-xs font-semibold text-slate-300">
                                    <span className="flex justify-between">
                                        <span>Angle of Attack (α)</span>
                                        <span className="font-mono text-sky-400">{aoa}°</span>
                                    </span>
                                    <input type="range" min="-25" max="25" step="1" value={aoa} onChange={e=>setAoA(Number(e.target.value))}/>
                                </label>

                                <label className="flex flex-col text-xs font-semibold text-slate-300">
                                    <span className="flex justify-between">
                                        <span>Streamline Density</span>
                                        <span className="font-mono text-sky-400">{particleCount}</span>
                                    </span>
                                    <input type="range" min="1000" max="6000" step="500" value={particleCount} onChange={e=>setParticleCount(Number(e.target.value))}/>
                                </label>

                                <label className="flex flex-col text-xs font-semibold text-slate-300">
                                    <span className="flex justify-between">
                                        <span>Vorticity Confinement</span>
                                        <span className="font-mono text-sky-400">{vorticityBoost.toFixed(1)}</span>
                                    </span>
                                    <input type="range" min="0" max="6.0" step="0.2" value={vorticityBoost} onChange={e=>setVorticityBoost(Number(e.target.value))}/>
                                </label>
                            </div>

                            {/* Controls */}
                            <div className="flex gap-2 pt-2">
                                <button onClick={()=>setIsPaused(!isPaused)} 
                                        className={`flex-1 py-2 rounded-xl font-bold text-xs uppercase tracking-wider transition ${isPaused ? 'bg-emerald-600 hover:bg-emerald-500 text-white' : 'bg-amber-600 hover:bg-amber-500 text-white'}`}>
                                    {isPaused ? '▶ Resume' : '⏸ Pause'}
                                </button>
                                <button onClick={()=>simRef.current?.reset()} 
                                        className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 rounded-xl font-bold text-xs uppercase tracking-wider transition border border-slate-700">
                                    🔄 Reset Flow
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* High Precision Graphics Viewport */}
                    <div className="w-full lg:w-2/3 flex flex-col items-center justify-center bg-slate-950 rounded-2xl border-2 border-slate-800 p-3 shadow-2xl relative overflow-hidden min-h-[400px]">
                        <div className="absolute top-4 left-5 text-xs font-mono bg-slate-900/90 text-sky-300 px-3.5 py-1.5 rounded-full border border-slate-700 z-10 pointer-events-none shadow-lg flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-sky-400 animate-ping"></span>
                            <span>High-DPI Vector Streamlines • Interactive Flow Field</span>
                        </div>

                        <canvas ref={displayCanvasRef} 
                                onPointerDown={handleCanvasPointer} 
                                onPointerMove={handleCanvasPointer}
                                className="cfd-canvas w-full h-auto rounded-xl border border-slate-800/90 shadow-2xl bg-slate-950" />

                        <div className="w-full flex justify-between items-center px-3 py-2 text-xs text-slate-400 font-mono">
                            <span>Visualization: <strong className="text-sky-400 uppercase">{visMode}</strong></span>
                            <span>Engine: <strong className="text-emerald-400">Navier-Stokes RK2 Streamline Advection</strong></span>
                        </div>
                    </div>
                </div>
            );
        };

        const RocketEngineSizer = ({ onUpdateCustomRocket, onLoadCFD }) => {
            const [unit, setUnit] = React.useState('SI');
            const [tab, setTab] = React.useState('combined');

            /* Internal Physics State */
            const [thrustKN, setThrustKN] = React.useState(35);
            const [pcMPa, setPcMPa] = React.useState(4.0);
            const [paKPa, setPaKPa] = React.useState(101.3);
            const [contractionRatio, setContractionRatio] = React.useState(3.5);
            const [propellant, setPropellant] = React.useState('N2O/Ethanol');
            const [nozzleShape, setNozzleShape] = React.useState('bell');

            /* New Customization Controls */
            const [customOF, setCustomOF] = React.useState(4.0);
            const [thetaConv, setThetaConv] = React.useState(30); /* Convergent Half Angle (deg) */
            const [thetaDiv, setThetaDiv] = React.useState(15);  /* Divergent Half Angle (deg) */

            const propData = {
                'N2O/Ethanol':   { gamma: 1.23, mw: 25.2, Tc: 3050, Lstar: 1.25, defaultOF: 4.0, name: "N₂O / Ethanol (Nitrous Biprop)" },
                'N2O/Isopropyl': { gamma: 1.22, mw: 26.1, Tc: 2980, Lstar: 1.20, defaultOF: 4.5, name: "N₂O / Isopropyl Alcohol (IPA)" },
                'LOX/RP-1':      { gamma: 1.24, mw: 22.0, Tc: 3670, Lstar: 1.15, defaultOF: 2.56, name: "LOX / RP-1 (Kerosene)" },
                'LOX/LH2':       { gamma: 1.26, mw: 12.0, Tc: 3500, Lstar: 0.85, defaultOF: 6.0, name: "LOX / Liquid Hydrogen" },
                'LOX/CH4':       { gamma: 1.20, mw: 18.0, Tc: 3600, Lstar: 0.95, defaultOF: 3.2, name: "LOX / Methane" },
                'NTO/MMH':       { gamma: 1.21, mw: 23.5, Tc: 3400, Lstar: 0.90, defaultOF: 2.1, name: "NTO / MMH (Hypergolic)" }
            };

            /* Sync O/F ratio when propellant changes */
            React.useEffect(() => {
                setCustomOF(propData[propellant].defaultOF);
            }, [propellant]);

            const g0 = 9.80665;
            const Ru = 8314.46;

            const fmtLen = (m) => unit === 'SI' ? `${(m*100).toFixed(1)} cm` : `${(m*39.3701).toFixed(2)} in`;
            const fmtMass = (kg_s) => unit === 'SI' ? `${kg_s.toFixed(2)} kg/s` : `${(kg_s*2.20462).toFixed(2)} lb/s`;
            const fmtVel = (m_s) => unit === 'SI' ? `${m_s.toFixed(0)} m/s` : `${(m_s*3.28084).toFixed(0)} ft/s`;

            const calculateEngine = () => {
                const data = propData[propellant];
                const y = data.gamma;
                const R = Ru / data.mw;
                
                const F_N = thrustKN * 1000;
                const Pc_Pa = pcMPa * 1000000;
                const Pa_Pa = paKPa * 1000;

                if (Pc_Pa <= Pa_Pa) return null;

                const pressureRatio = Pc_Pa / Pa_Pa;
                const term1 = Math.max(0, Math.pow(pressureRatio, (y - 1) / y) - 1);
                const Me = Math.sqrt((2 / (y - 1)) * term1);

                const term2 = (2 + (y - 1) * Math.pow(Me, 2)) / (y + 1);
                const epsilon = Math.max(1.0, (1 / (Me || 1)) * Math.pow(term2, (y + 1) / (2 * (y - 1))));

                const Cf = Math.sqrt(
                    ((2 * Math.pow(y, 2)) / (y - 1)) * 
                    Math.pow(2 / (y + 1), (y + 1) / (y - 1)) * 
                    (1 - Math.pow(1 / pressureRatio, (y - 1) / y))
                );

                const cStar = Math.sqrt(y * R * data.Tc) / 
                              (y * Math.sqrt(Math.pow(2 / (y + 1), (y + 1) / (y - 1))));

                const Isp = (Cf * cStar) / g0;

                const At = F_N / (Pc_Pa * Cf);
                const Ae = epsilon * At;
                const Dt = Math.sqrt((4 * At) / Math.PI);
                const De = Math.sqrt((4 * Ae) / Math.PI);
                const mDot = F_N / (Isp * g0);

                const Ac = contractionRatio * At;
                const Dc = Math.sqrt((4 * Ac) / Math.PI);
                const Vc = data.Lstar * At;

                /* Geometry with Custom Half Angles */
                const thetaConvRad = thetaConv * (Math.PI / 180);
                const thetaDivRad = thetaDiv * (Math.PI / 180);

                const L_conv = ((Dc - Dt) / 2) / Math.tan(thetaConvRad);
                const V_conv = (Math.PI / 12) * L_conv * (Math.pow(Dc, 2) + Dc * Dt + Math.pow(Dt, 2));
                
                const V_cyl = Math.max(Vc - V_conv, 0.15 * Vc);
                const L_cyl = V_cyl / Ac;
                const L_div = ((De - Dt) / 2) / Math.tan(thetaDivRad) * (nozzleShape === 'bell' ? 0.8 : 1.0);

                const tau_r = (data.Lstar / cStar) * 1000;

                const mDot_ox = mDot * (customOF / (customOF + 1));
                const mDot_f = mDot * (1 / (customOF + 1));

                return { Me, epsilon, Cf, cStar, Isp, At, Ae, Dt, De, mDot, mDot_ox, mDot_f, Ac, Dc, Vc, L_cyl, L_conv, L_div, tau_r };
            };

            const results = calculateEngine();

            /* Sync geometry to parent state for CFD Simulation */
            React.useEffect(() => {
                if (results && onUpdateCustomRocket) {
                    onUpdateCustomRocket({
                        Dc: results.Dc,
                        Dt: results.Dt,
                        De: results.De,
                        L_cyl: results.L_cyl,
                        L_conv: results.L_conv,
                        L_div: results.L_div,
                        shape: nozzleShape
                    });
                }
            }, [thrustKN, pcMPa, paKPa, contractionRatio, propellant, customOF, thetaConv, thetaDiv, nozzleShape]);

            const UnitSlider = ({ label, si, imp, info }) => {
                const conf = unit === 'SI' ? si : imp;
                return (
                    <label className="flex flex-col gap-1 text-xs font-semibold text-slate-300">
                        <span className="flex justify-between items-end">
                            <span>{label}</span>
                            <span className="font-mono text-amber-400">
                                {Number(conf.val).toFixed(conf.step < 1 ? 1 : 0)} {conf.unit}
                            </span>
                        </span>
                        <input type="range" min={conf.min} max={conf.max} step={conf.step} value={conf.val}
                               onChange={e => conf.set(Number(e.target.value))}
                               className="mt-1" />
                        {info && <span className="text-[10px] text-slate-400 font-normal">{info}</span>}
                    </label>
                );
            };

            const OutputBox = ({ label, value, colorClass }) => (
                <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex flex-col justify-center shadow-inner">
                    <p className="text-slate-400 text-[10px] leading-tight mb-1 uppercase tracking-wider">{label}</p>
                    <p className={`text-base md:text-lg font-bold font-mono ${colorClass}`}>{value}</p>
                </div>
            );

            const renderNozzleSVG = () => {
                if (!results) return null;

                const width = 640;
                const height = 320;
                const centerY = height / 2;
                
                const maxDim = Math.max(results.De, results.Dc, 0.25);
                const scale = (height * 0.65) / maxDim;
                
                const r_c = (results.Dc / 2) * scale;
                const r_t = (results.Dt / 2) * scale;
                const r_e = (results.De / 2) * scale;
                
                const x_inj = 40;
                const x_cyl_end = x_inj + Math.min(Math.max(results.L_cyl * scale * 2.5, 80), 160);
                const x_throat = x_cyl_end + Math.min(Math.max(results.L_conv * scale * 2.5, 45), 90);
                const x_exit = Math.min(x_throat + Math.min(Math.max(results.L_div * scale * 2.5, 80), 220), width - 40);

                const chamberTop = `M ${x_inj},${centerY - r_c} L ${x_cyl_end},${centerY - r_c} L ${x_throat},${centerY - r_t}`;
                const chamberBottom = `M ${x_throat},${centerY + r_t} L ${x_cyl_end},${centerY + r_c} L ${x_inj},${centerY + r_c}`;
                
                let nozzleTop = "";
                let nozzleBottom = "";
                
                if (nozzleShape === 'bell') {
                    nozzleTop = `M ${x_throat},${centerY - r_t} C ${x_throat + 40},${centerY - r_t} ${x_exit - 60},${centerY - r_e} ${x_exit},${centerY - r_e}`;
                    nozzleBottom = `M ${x_exit},${centerY + r_e} C ${x_exit - 60},${centerY + r_e} ${x_throat + 40},${centerY + r_t} ${x_throat},${centerY + r_t}`;
                } else {
                    nozzleTop = `M ${x_throat},${centerY - r_t} L ${x_exit},${centerY - r_e}`;
                    nozzleBottom = `M ${x_exit},${centerY + r_e} L ${x_throat},${centerY + r_t}`;
                }

                const chamberFill = `${chamberTop} ${chamberBottom} Z`;
                const nozzleFill = `${nozzleTop} ${nozzleBottom} Z`;

                const chamberOpacity = (tab === 'chamber' || tab === 'combined') ? 1.0 : 0.15;
                const nozzleOpacity = (tab === 'nozzle' || tab === 'combined') ? 1.0 : 0.15;

                return (
                    <svg className="w-full h-full drop-shadow-2xl transition-all duration-500" viewBox={`0 0 ${width} ${height}`}>
                        <defs>
                            <linearGradient id="chamberFlame" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stopColor="#ef4444" stopOpacity="0.85" />
                                <stop offset="45%" stopColor="#f97316" stopOpacity="0.9" />
                                <stop offset="100%" stopColor="#eab308" stopOpacity="0.95" />
                            </linearGradient>
                            <linearGradient id="nozzleFlame" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stopColor="#eab308" stopOpacity="0.95" />
                                <stop offset="40%" stopColor="#38bdf8" stopOpacity="0.85" />
                                <stop offset="100%" stopColor="#818cf8" stopOpacity="0.6" />
                            </linearGradient>
                            <linearGradient id="plumeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stopColor="#818cf8" stopOpacity="0.6" />
                                <stop offset="100%" stopColor="#c084fc" stopOpacity="0.0" />
                            </linearGradient>
                        </defs>

                        {/* Fills */}
                        <path d={chamberFill} fill="url(#chamberFlame)" opacity={chamberOpacity} className="transition-opacity duration-300" />
                        <path d={nozzleFill} fill="url(#nozzleFlame)" opacity={nozzleOpacity} className="transition-opacity duration-300" />
                        <path d={`M ${x_exit},${centerY - r_e} Q ${x_exit + 80},${centerY} ${x_exit},${centerY + r_e} Z`} 
                              fill="url(#plumeGrad)" opacity={nozzleOpacity} className="transition-opacity duration-300" />

                        {/* Strokes */}
                        <path d={chamberTop} fill="none" stroke="#f8fafc" strokeWidth="4" strokeLinecap="round" opacity={chamberOpacity} className="transition-opacity duration-300" />
                        <path d={chamberBottom} fill="none" stroke="#f8fafc" strokeWidth="4" strokeLinecap="round" opacity={chamberOpacity} className="transition-opacity duration-300" />
                        
                        <path d={nozzleTop} fill="none" stroke="#f8fafc" strokeWidth="4" strokeLinecap="round" opacity={nozzleOpacity} className="transition-opacity duration-300" />
                        <path d={nozzleBottom} fill="none" stroke="#f8fafc" strokeWidth="4" strokeLinecap="round" opacity={nozzleOpacity} className="transition-opacity duration-300" />

                        <rect x={x_inj - 12} y={centerY - r_c - 8} width="12" height={r_c * 2 + 16} fill="#334155" rx="3" stroke="#0f172a" strokeWidth="2" opacity={chamberOpacity} />
                        
                        {(tab === 'chamber' || tab === 'combined') && (
                            <>
                                <text x={x_inj + 15} y={centerY - 8} className="text-xs fill-amber-300 font-mono font-bold">Dc: {fmtLen(results.Dc)}</text>
                                <text x={x_cyl_end - 20} y={centerY + r_c + 20} className="text-xs fill-slate-300 font-mono font-bold">Lcyl: {fmtLen(results.L_cyl)}</text>
                            </>
                        )}
                        {(tab === 'nozzle' || tab === 'combined') && (
                            <>
                                <text x={x_throat} y={centerY - r_t - 10} className="text-xs fill-sky-300 font-mono font-bold" textAnchor="middle">Dt: {fmtLen(results.Dt)}</text>
                                <text x={x_exit} y={centerY - r_e - 10} className="text-xs fill-emerald-300 font-mono font-bold" textAnchor="middle">De: {fmtLen(results.De)}</text>
                            </>
                        )}
                    </svg>
                );
            };

            return (
                <div className="flex flex-col gap-4 w-full p-2">
                    {/* Top Navigation Bar */}
                    <div className="flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-900/85 p-4 rounded-2xl border border-slate-700/80 shadow-xl">
                        <div className="flex bg-slate-950 p-1.5 rounded-xl border border-slate-800 w-full md:w-auto">
                            {[
                                { id: 'chamber', label: 'Chamber Sizer' },
                                { id: 'nozzle', label: 'Nozzle Maker' },
                                { id: 'combined', label: 'Combined System' }
                            ].map(t => (
                                <button key={t.id} onClick={() => setTab(t.id)}
                                        className={`flex-1 md:flex-none py-2 px-4 text-xs font-bold rounded-lg transition ${tab === t.id ? 'bg-amber-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                                    {t.label}
                                </button>
                            ))}
                        </div>
                        
                        <div className="flex items-center gap-3">
                            <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">Units:</span>
                            <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800">
                                <button onClick={() => setUnit('SI')} className={`px-3 py-1.5 text-[10px] font-bold rounded transition ${unit === 'SI' ? 'bg-slate-700 text-sky-300 shadow-inner' : 'text-slate-500 hover:text-slate-300'}`}>SI Metric</button>
                                <button onClick={() => setUnit('Imperial')} className={`px-3 py-1.5 text-[10px] font-bold rounded transition ${unit === 'Imperial' ? 'bg-slate-700 text-amber-300 shadow-inner' : 'text-slate-500 hover:text-slate-300'}`}>Imperial</button>
                            </div>
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-6 w-full">
                        {/* Control Sidebar */}
                        <div className="w-full lg:w-1/3 flex flex-col gap-5">
                            <div className="bg-slate-900/85 p-5 rounded-2xl border border-slate-700/80 space-y-4 shadow-xl">
                                <label className="flex flex-col gap-1 text-xs font-semibold text-slate-300">
                                    <span className="flex justify-between items-end">
                                        <span>Propellant Combination</span>
                                    </span>
                                    <select className="bg-slate-950 border border-slate-800 rounded-xl p-2 mt-1 font-mono text-sm text-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-500" 
                                            value={propellant} onChange={e=>setPropellant(e.target.value)}>
                                        {Object.entries(propData).map(([key, data]) => (
                                            <option key={key} value={key}>{data.name}</option>
                                        ))}
                                    </select>
                                </label>

                                {/* Custom O/F Ratio Slider */}
                                <label className="flex flex-col gap-1 text-xs font-semibold text-slate-300">
                                    <span className="flex justify-between items-end">
                                        <span>Oxidizer-to-Fuel Ratio (O/F)</span>
                                        <span className="font-mono text-sky-400">{customOF.toFixed(2)}</span>
                                    </span>
                                    <input type="range" min="1.0" max="8.0" step="0.05" value={customOF} onChange={e=>setCustomOF(Number(e.target.value))} className="mt-1"/>
                                </label>

                                {/* Nozzle Angles */}
                                {(tab === 'nozzle' || tab === 'combined') && (
                                    <>
                                        <label className="flex flex-col gap-1 text-xs font-semibold text-slate-300">
                                            Nozzle Contour Type
                                            <select className="bg-slate-950 border border-slate-800 rounded-xl p-2 mt-1 font-mono text-sm text-purple-300 focus:outline-none focus:ring-2 focus:ring-purple-500" 
                                                    value={nozzleShape} onChange={e=>setNozzleShape(e.target.value)}>
                                                <option value="bell">Bell (Rao Approximation)</option>
                                                <option value="conical">Conical (15° Half-Angle)</option>
                                            </select>
                                        </label>

                                        <label className="flex flex-col gap-1 text-xs font-semibold text-slate-300">
                                            <span className="flex justify-between items-end">
                                                <span>Convergent Half Angle (θconv)</span>
                                                <span className="font-mono text-amber-400">{thetaConv}°</span>
                                            </span>
                                            <input type="range" min="15" max="45" step="1" value={thetaConv} onChange={e=>setThetaConv(Number(e.target.value))} className="mt-1"/>
                                        </label>

                                        <label className="flex flex-col gap-1 text-xs font-semibold text-slate-300">
                                            <span className="flex justify-between items-end">
                                                <span>Divergent Half Angle (θdiv)</span>
                                                <span className="font-mono text-amber-400">{thetaDiv}°</span>
                                            </span>
                                            <input type="range" min="8" max="30" step="1" value={thetaDiv} onChange={e=>setThetaDiv(Number(e.target.value))} className="mt-1"/>
                                        </label>
                                    </>
                                )}

                                <UnitSlider 
                                    label="Target Thrust" 
                                    si={{val: thrustKN, min: 2, max: 500, step: 1, unit: 'kN', set: setThrustKN}}
                                    imp={{val: thrustKN * 224.809, min: 500, max: 110000, step: 100, unit: 'lbf', set: (v) => setThrustKN(v / 224.809)}}
                                />

                                <UnitSlider 
                                    label="Chamber Pressure (Pc)" 
                                    si={{val: pcMPa, min: 1, max: 20, step: 0.1, unit: 'MPa', set: setPcMPa}}
                                    imp={{val: pcMPa * 145.038, min: 150, max: 3000, step: 10, unit: 'psi', set: (v) => setPcMPa(v / 145.038)}}
                                />

                                {(tab === 'chamber' || tab === 'combined') && (
                                    <label className="flex flex-col gap-1 text-xs font-semibold text-slate-300 animate-fade-in">
                                        <span className="flex justify-between items-end">
                                            <span>Contraction Ratio (Ac / At)</span>
                                            <span className="font-mono text-amber-400">{contractionRatio.toFixed(1)}</span>
                                        </span>
                                        <input type="range" min="1.5" max="8.0" step="0.1" value={contractionRatio} onChange={e=>setContractionRatio(Number(e.target.value))} className="mt-1"/>
                                    </label>
                                )}

                                {(tab === 'nozzle' || tab === 'combined') && (
                                    <UnitSlider 
                                        label="Ambient Pressure (Pa)" 
                                        si={{val: paKPa, min: 0.1, max: 101.3, step: 0.5, unit: 'kPa', set: setPaKPa}}
                                        imp={{val: paKPa * 0.145038, min: 0.01, max: 14.7, step: 0.1, unit: 'psi', set: (v) => setPaKPa(v / 0.145038)}}
                                        info={unit === 'SI' ? "101.3 = Sea Level | 0.1 ≈ Vacuum" : "14.7 = Sea Level | 0.01 ≈ Vacuum"}
                                    />
                                )}
                            </div>

                            <div className="bg-slate-900/90 text-white p-5 rounded-2xl border border-slate-700 shadow-xl flex-grow">
                                <h4 className="font-bold text-amber-300 border-b border-slate-700/80 pb-2 mb-3 text-sm flex items-center justify-between">
                                    <span>Calculated Results</span>
                                    <span className="text-[10px] text-slate-400 font-mono bg-slate-950 px-2 py-1 rounded">Ideal Gas Model</span>
                                </h4>
                                
                                {!results ? (
                                    <p className="text-rose-400 text-xs text-center py-4">Pc must exceed ambient pressure to establish supersonic flow.</p>
                                ) : (
                                    <div className="grid grid-cols-2 gap-2">
                                        <OutputBox label="Specific Impulse" value={`${results.Isp.toFixed(1)} s`} colorClass="text-amber-400" />
                                        <OutputBox label="Total Mass Flow" value={fmtMass(results.mDot)} colorClass="text-sky-400" />
                                        
                                        <div className="col-span-2 flex justify-between px-1 mb-1 text-[10px] font-mono text-slate-400 border-b border-slate-800/50 pb-1.5">
                                            <span>Oxidizer Flow: <span className="text-sky-300">{fmtMass(results.mDot_ox)}</span></span>
                                            <span>Fuel Flow: <span className="text-rose-300">{fmtMass(results.mDot_f)}</span></span>
                                        </div>
                                        
                                        {(tab === 'chamber' || tab === 'combined') && (
                                            <>
                                                <OutputBox label="Chamber Dia (Dc)" value={fmtLen(results.Dc)} colorClass="text-emerald-400" />
                                                <OutputBox label="Chamber Length" value={fmtLen(results.L_cyl)} colorClass="text-emerald-400" />
                                            </>
                                        )}

                                        {(tab === 'nozzle' || tab === 'combined') && (
                                            <>
                                                <OutputBox label="Throat Dia (Dt)" value={fmtLen(results.Dt)} colorClass="text-sky-300" />
                                                <OutputBox label="Exit Dia (De)" value={fmtLen(results.De)} colorClass="text-purple-400" />
                                            </>
                                        )}

                                        <div className="col-span-2 pt-2 mt-1 border-t border-slate-800 flex flex-wrap justify-between gap-y-1 text-[11px] text-slate-300">
                                            <span>Exit Mach: <strong className="text-sky-300">M {results.Me.toFixed(2)}</strong></span>
                                            <span>Exp Ratio: <strong className="text-amber-300">ε = {results.epsilon.toFixed(1)}</strong></span>
                                            <span>Char Vel (c*): <strong className="text-emerald-300">{fmtVel(results.cStar)}</strong></span>
                                            <span>Thrust Coeff (Cf): <strong className="text-purple-300">{results.Cf.toFixed(3)}</strong></span>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* High Precision Graphics Viewport */}
                        <div className="w-full lg:w-2/3 min-h-[400px] bg-slate-950 rounded-2xl border-2 border-slate-800 flex flex-col items-center justify-between p-4 shadow-2xl relative overflow-hidden">
                            <div className="w-full flex justify-between items-center z-10">
                                <div className="text-xs font-mono bg-slate-900/90 text-amber-300 px-3.5 py-1.5 rounded-full border border-slate-700 shadow-md">
                                    {tab === 'chamber' ? 'Combustion Chamber Geometry' : tab === 'nozzle' ? 'De Laval Nozzle Geometry' : 'Complete Engine Schematic'} • {propData[propellant].name}
                                </div>
                                
                                <button onClick={onLoadCFD} 
                                        className="bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-slate-950 font-extrabold text-xs px-4 py-2 rounded-xl shadow-lg transition transform hover:scale-105 flex items-center gap-1.5">
                                    <span>🚀 Simulate Engine Flow in CFD</span>
                                </button>
                            </div>

                            <div className="w-full flex-grow flex items-center justify-center">
                                {renderNozzleSVG()}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SimulationCard = ({ title, description, children }) => (
            <div className="glass-card p-6 md:p-8 flex flex-col mb-12 w-full">
                <div className="max-w-4xl mb-6">
                    <h3 className="text-2xl md:text-3xl font-extrabold text-white mb-2 tracking-tight">{title}</h3>
                    <p className="text-slate-300 text-base leading-relaxed font-medium">{description}</p>
                </div>
                <div className="w-full">
                    {children}
                </div>
            </div>
        );

        const App = () => {
            const [customRocket, setCustomRocket] = React.useState({
                Dc: 0.12,
                Dt: 0.05,
                De: 0.11,
                L_cyl: 0.15,
                L_conv: 0.06,
                L_div: 0.14,
                shape: 'bell'
            });

            const [selectedObstacle, setSelectedObstacle] = React.useState('designedRocket');

            const handleLoadCFD = () => {
                setSelectedObstacle('designedRocket');
                const cfdElement = document.getElementById('cfd-viewport');
                if (cfdElement) {
                    cfdElement.scrollIntoView({ behavior: 'smooth' });
                }
            };

            return (
                <div className="py-12 px-4 sm:px-8 lg:px-16 w-full max-w-[1600px] mx-auto">
                    
                    {/* Header */}
                    <header className="mb-16 text-center pt-6">
                        <div className="inline-block px-5 py-2 glass-panel rounded-full text-sky-300 font-bold text-xs mb-4 uppercase tracking-widest border border-sky-500/30">
                            Graduating Spring 2027
                        </div>
                        <h1 className="text-5xl md:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-indigo-300 to-purple-400 tracking-tight mb-3 drop-shadow-lg">
                            Cash Bilton
                        </h1>
                        <p className="text-2xl text-slate-200 font-semibold mx-auto mt-1">
                            Mechanical Engineering Portfolio
                        </p>
                        <p className="text-lg text-sky-400 font-medium mx-auto mt-1">
                            Minors in Aerospace & AERE • Michigan Technological University
                        </p>
                    </header>

                    {/* Academic Focus & Experience Grid */}
                    <section className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-16 max-w-5xl mx-auto">
                        <div className="glass-panel p-8 rounded-3xl h-full transition hover:scale-[1.01] duration-300 border border-slate-700">
                            <h2 className="text-2xl font-bold text-sky-300 mb-4 flex items-center gap-2">
                                <span className="text-3xl">🚀</span> Academic Focus
                            </h2>
                            <p className="text-slate-300 leading-relaxed font-medium text-base">
                                Passionate about <strong>Fluid Dynamics, Computational Aerodynamics, and Rocket Propulsion systems.</strong> 
                                Building interactive mathematical models and real-time CFD fluid solvers to simulate complex engineering physics.
                            </p>
                        </div>

                        <div className="glass-panel p-8 rounded-3xl h-full transition hover:scale-[1.01] duration-300 border border-slate-700">
                            <h2 className="text-2xl font-bold text-indigo-300 mb-2 flex items-center gap-2">
                                <span className="text-3xl">🧮</span> Math Learning Center Coach
                            </h2>
                            <h3 className="text-sm text-sky-400 font-bold mb-3">MTU (Sophomore Year – Present)</h3>
                            <ul className="text-slate-300 font-medium space-y-2 list-disc pl-5 text-sm">
                                <li>Tutor engineering peers in Calculus, Differential Equations, and Linear Algebra.</li>
                                <li>Translate abstract mathematical theorems into concrete, solveable engineering paradigms.</li>
                                <li>Cultivate collaborative problem-solving methodologies to improve cohort retention.</li>
                            </ul>
                        </div>
                    </section>

                    {/* Interactive Simulations */}
                    <section className="w-full flex flex-col items-center">
                        <div className="text-center max-w-3xl mb-12">
                            <h2 className="text-4xl font-extrabold text-white mb-3">Interactive Fluids & Propulsion Physics</h2>
                            <p className="text-lg text-slate-300 font-medium">
                                Real-time high-DPI vector fluid solvers and propulsion design tools built in React.
                            </p>
                        </div>

                        {/* High-Resolution CFD Visualizer */}
                        <SimulationCard
                            title="High-Resolution Vector CFD Fluid Simulator"
                            description="Solves 2D incompressible Navier-Stokes equations with anti-aliased Runge-Kutta particle streamlines, vorticity confinement, pressure projection, and optical Schlieren imaging around aerospace geometries or your custom rocket engine profile."
                        >
                            <CFDSimulator 
                                customRocket={customRocket} 
                                selectedObstacle={selectedObstacle} 
                                setSelectedObstacle={setSelectedObstacle} 
                            />
                        </SimulationCard>

                        {/* Rocket Engine Simulation */}
                        <SimulationCard
                            title="Propulsion: Liquid Rocket Combustion Chamber & Nozzle Sizer"
                            description="Sizes combustion chambers and nozzles with customizable O/F ratio and nozzle half angles for Nitrous Oxide (N₂O), LOX, Ethanol, and Isopropyl Alcohol rocket engines."
                        >
                            <RocketEngineSizer 
                                onUpdateCustomRocket={setCustomRocket} 
                                onLoadCFD={handleLoadCFD} 
                            />
                        </SimulationCard>
                    </section>

                    {/* Footer */}
                    <footer className="pt-16 pb-10 text-center text-slate-400 font-medium flex flex-col items-center justify-center space-y-2">
                        <div className="w-24 h-1 bg-gradient-to-r from-sky-400 to-indigo-500 rounded-full mb-6"></div>
                        <p className="text-lg font-bold text-white">Cash Bilton</p>
                        <p>&copy; {new Date().getFullYear()} All rights reserved.</p>
                        <p className="text-sm text-slate-500">Built with React & Tailwind CSS.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
