                                        <span className="flex justify-between items-end">
                                            <span>Contraction Ratio (Ac / At)</span>
                                            <span className="font-mono text-[#4a5d3c]">{contractionRatio.toFixed(1)}</span>
                                        </span>
                                        <input type="range" min="1.5" max="8.0" step="0.1" value={contractionRatio} onChange={e=>setContractionRatio(Number(e.target.value))} className="mt-1"/>
                                    </label>
                                )}

                                {(tab === 'nozzle' || tab === 'combined') && (
                                    <UnitSlider 
                                        label="Ambient Pressure (Pa)" 
                                        si={{val: paKPa, min: 0.1, max: 101.3, step: 0.5, unit: 'kPa', set: setPaKPa}}
                                        imp={{val: paKPa * 0.145038, min: 0.01, max: 14.7, step: 0.1, unit: 'psi', set: (v) => setPaKPa(v / 0.145038)}}
                                        info={unit === 'SI' ? "101.3 = Sea Level | 0.1 ≈ Vacuum" : "14.7 = Sea Level | 0.01 ≈ Vacuum"}
                                    />
                                )}
                            </div>

                            <div className="bg-[#424e37] text-white p-5 rounded-2xl border border-[#2d3628]/30 shadow-md flex-grow">
                                <h4 className="font-bold text-[#e6dec9] border-b border-white/20 pb-2 mb-3 text-sm flex items-center justify-between">
                                    <span>Calculated Results</span>
                                    <span className="text-[10px] text-[#c2b8a3] font-mono bg-[#2d3628]/40 px-2 py-1 rounded">Ideal Gas Model</span>
                                </h4>
                                
                                {!results ? (
                                    <p className="text-[#f9c5c5] text-xs text-center py-4">Pc must exceed ambient pressure to establish supersonic flow.</p>
                                ) : (
                                    <div className="grid grid-cols-2 gap-2">
                                        <OutputBox label="Specific Impulse" value={`${results.Isp.toFixed(1)} s`} colorClass="text-white" />
                                        <OutputBox label="Total Mass Flow" value={fmtMass(results.mDot)} colorClass="text-white" />
                                        
                                        <div className="col-span-2 flex justify-between px-1 mb-1 text-[10px] font-mono text-[#c2b8a3] border-b border-white/20 pb-1.5">
                                            <span>Oxidizer Flow: <span className="text-white">{fmtMass(results.mDot_ox)}</span></span>
                                            <span>Fuel Flow: <span className="text-white">{fmtMass(results.mDot_f)}</span></span>
                                        </div>
                                        
                                        {(tab === 'chamber' || tab === 'combined') && (
                                            <>
                                                <OutputBox label="Chamber Dia (Dc)" value={fmtLen(results.Dc)} colorClass="text-[#e6dec9]" />
                                                <OutputBox label="Chamber Length" value={fmtLen(results.L_cyl)} colorClass="text-[#e6dec9]" />
                                            </>
                                        )}

                                        {(tab === 'nozzle' || tab === 'combined') && (
                                            <>
                                                <OutputBox label="Throat Dia (Dt)" value={fmtLen(results.Dt)} colorClass="text-[#d0d6c4]" />
                                                <OutputBox label="Exit Dia (De)" value={fmtLen(results.De)} colorClass="text-[#d0d6c4]" />
                                            </>
                                        )}

                                        <div className="col-span-2 pt-2 mt-1 border-t border-white/10 flex flex-wrap justify-between gap-y-1 text-[11px] text-[#d8cfbc]">
                                            <span>Exit Mach: <strong className="text-white">M {results.Me.toFixed(2)}</strong></span>
                                            <span>Exp Ratio: <strong className="text-white">ε = {results.epsilon.toFixed(1)}</strong></span>
                                            <span>Char Vel (c*): <strong className="text-white">{fmtVel(results.cStar)}</strong></span>
                                            <span>Thrust Coeff (Cf): <strong className="text-white">{results.Cf.toFixed(3)}</strong></span>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="w-full lg:w-2/3 min-h-[400px] bg-stone-100/50 rounded-2xl border border-stone-200 flex flex-col items-center justify-between p-4 shadow-sm relative overflow-hidden">
                            <div className="w-full flex justify-between items-center z-10">
                                <div className="text-xs font-mono bg-white text-stone-600 px-3.5 py-1.5 rounded-full border border-stone-200 shadow-sm">
                                    {tab === 'chamber' ? 'Combustion Chamber Geometry' : tab === 'nozzle' ? 'De Laval Nozzle Geometry' : 'Complete Engine Schematic'} • {propData[propellant].name}
                                </div>
                                
                                <button onClick={onLoadCFD} 
                                        className="bg-[#6b7a57] hover:bg-[#4a5d3c] text-white font-bold text-xs px-4 py-2 rounded-xl shadow-md transition transform hover:scale-[1.02] flex items-center gap-1.5">
                                    <span>Simulate Engine Flow in CFD</span>
                                </button>
                            </div>

                            <div className="w-full flex-grow flex items-center justify-center py-4">
                                {renderNozzleSVG()}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [customRocket, setCustomRocket] = React.useState({
                Dc: 0.12,
                Dt: 0.05,
                De: 0.11,
                L_cyl: 0.15,
                L_conv: 0.06,
                L_div: 0.14,
                shape: 'bell'
            });

            const [selectedObstacle, setSelectedObstacle] = React.useState('nozzle');
            const [activeTab, setActiveTab] = React.useState('cfd');

            const handleLoadCFD = () => {
                setSelectedObstacle('nozzle');
                setActiveTab('cfd');
            };

            return (
                <div className="py-12 px-4 sm:px-8 lg:px-16 w-full max-w-[1600px] mx-auto">
                    
                    {/* Header */}
                    <header className="mb-14 text-center pt-6">
                        <div className="inline-block px-5 py-2 bg-stone-100 rounded-full text-stone-500 font-bold text-xs mb-4 uppercase tracking-widest border border-stone-200 shadow-sm">
                            Graduating Spring 2027
                        </div>
                        <h1 className="text-5xl md:text-7xl font-extrabold text-[#2d3628] tracking-tight mb-3 drop-shadow-sm">
                            Cash Bilton
                        </h1>
                        <p className="text-2xl text-[#4a5d3c] font-semibold mx-auto mt-2">
                            Mechanical Engineering Portfolio
                        </p>
                        <p className="text-base text-stone-600 font-medium mx-auto mt-2">
                            Minors in Aerospace & AERE • Michigan Technological University
                        </p>
                    </header>

                    {/* Academic Focus & Experience Grid */}
                    <section className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-16 max-w-5xl mx-auto">
                        <div className="glass-panel p-8 rounded-3xl h-full transition hover:scale-[1.01] duration-300">
                            <h2 className="text-2xl font-bold text-[#2d3628] mb-4">
                                Academic Focus
                            </h2>
                            <p className="text-stone-700 leading-relaxed font-medium text-base">
                                Passionate about <strong>Fluid Dynamics, Computational Aerodynamics, and Rocket Propulsion systems.</strong> 
                                Building interactive mathematical models and real-time CFD fluid solvers to simulate complex engineering physics.
                            </p>
                        </div>

                        <div className="glass-panel p-8 rounded-3xl h-full transition hover:scale-[1.01] duration-300">
                            <h2 className="text-2xl font-bold text-[#2d3628] mb-2">
                                Math Learning Center Coach
                            </h2>
                            <h3 className="text-sm text-[#4a5d3c] font-bold mb-3">MTU (Sophomore Year – Present)</h3>
                            <ul className="text-stone-700 font-medium space-y-2 list-disc pl-5 text-sm">
                                <li>Tutor engineering peers in Calculus, Differential Equations, and Linear Algebra.</li>
                                <li>Translate abstract mathematical theorems into concrete, solveable engineering paradigms.</li>
                                <li>Cultivate collaborative problem-solving methodologies to improve cohort retention.</li>
                            </ul>
                        </div>
                    </section>

                    {/* Interactive Simulations Tabbed Interface */}
                    <section className="w-full flex flex-col items-center">
                        <div className="text-center max-w-3xl mb-8">
                            <h2 className="text-3xl md:text-4xl font-extrabold text-[#2d3628] mb-3">Interactive Engineering Tools</h2>
                            <p className="text-base text-stone-600 font-medium">
                                Explore fluid mechanics and propulsion design using my custom-built React physics applications.
                            </p>
                        </div>

                        <div className="w-full flex justify-center px-4 mb-0 relative z-10">
                            <div className="flex bg-stone-200/50 p-1.5 rounded-t-2xl border-t border-x border-stone-200/80 shadow-[0_-4px_10px_rgba(0,0,0,0.02)] space-x-2">
                                <button onClick={() => setActiveTab('cfd')} 
                                        className={`px-6 md:px-10 py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-all duration-300 ${activeTab === 'cfd' ? 'bg-[#fdfcfb] text-[#2d3628] shadow-sm' : 'text-stone-500 hover:text-stone-700 hover:bg-stone-200'}`}>
                                    GPU Fluid Solver (CFD)
                                </button>
                                <button onClick={() => setActiveTab('rocket')} 
                                        className={`px-6 md:px-10 py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-all duration-300 ${activeTab === 'rocket' ? 'bg-[#fdfcfb] text-[#2d3628] shadow-sm' : 'text-stone-500 hover:text-stone-700 hover:bg-stone-200'}`}>
                                    Propulsion Engine Sizer
                                </button>
                            </div>
                        </div>

                        <div className="glass-card p-6 md:p-8 w-full rounded-t-none -mt-1 relative z-0">
                            {activeTab === 'cfd' && (
                                <div className="animate-fade-in">
                                    <div className="max-w-4xl mb-6">
                                        <h3 className="text-2xl font-bold text-[#2d3628] mb-2">High-Resolution GPU CFD</h3>
                                        <p className="text-stone-600 text-sm font-medium">Solves 2D incompressible Navier-Stokes equations using a grid-based (Eulerian) approach. Implemented entirely in WebGL 2.0 Fragment Shaders, allowing the GPU to compute thousands of fluid cells in parallel for real-time performance.</p>
                                    </div>
                                    <WebGLCFDSimulator 
                                        customRocket={customRocket} 
                                        selectedObstacle={selectedObstacle} 
                                        setSelectedObstacle={setSelectedObstacle} 
                                    />
                                </div>
                            )}

                            {activeTab === 'rocket' && (
                                <div className="animate-fade-in">
                                    <div className="max-w-4xl mb-6">
                                        <h3 className="text-2xl font-bold text-[#2d3628] mb-2">Liquid Rocket Sizer</h3>
                                        <p className="text-stone-600 text-sm font-medium">Sizes combustion chambers and nozzles with customizable O/F ratio and nozzle half angles for various bipropellant rocket engines.</p>
                                    </div>
                                    <RocketEngineSizer 
                                        onUpdateCustomRocket={setCustomRocket} 
                                        onLoadCFD={handleLoadCFD} 
                                    />
                                </div>
                            )}
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="pt-16 pb-10 text-center text-stone-500 font-medium flex flex-col items-center justify-center space-y-2">
                        <div className="w-24 h-1 bg-stone-300 rounded-full mb-6"></div>
                        <p className="text-lg font-bold text-[#4a5d3c]">Cash Bilton</p>
                        <p>&copy; {new Date().getFullYear()} All rights reserved.</p>
                        <p className="text-xs text-stone-400">Built with React, WebGL2 & Tailwind CSS.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
